    Haar geliefde, de weduwe van de kapitein, sluit de gespen in de volgorde die bij zijn rang hoorde. Binnen één uur, minuut na minuut, gaat elke poort open, tot een wachter van vlees vraagt waarom ze
    niet naar hars ruikt. Dan komt uit wie de kapitein doodde.
