    overtocht betalen met een nacht. Elke nacht staat erin met naam en haven, en Ressa en haar matrozen worden er rijk van. Maar in elke haven blijven er matrozen achter, getrouwd aan land. Op de laatste
    bladzijde staan meer passagiers dan bemanning, en het schip hoort niet meer bij haar volk.'
