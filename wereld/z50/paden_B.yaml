    verleiden, een Aelthir die nog net aanraking voelt, en ze is niet de enige: elke vrouw in de rij heeft dat plan, en ze haten elkaar erom. Met elke naam die afvalt, weet Lisanne meer van hem. Haar eigen
    naam komt er nooit bij.'
