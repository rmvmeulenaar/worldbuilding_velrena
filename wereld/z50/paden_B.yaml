    laatste gloed en kraken de stutten. De hoedster telt hardop hoeveel tijd er rest. Gudrun zet haar rug onder de zoldering, Brokke slaat zoemend ijzer in de spleet, en de schacht waarin ze zich wilden
    binden, wordt de uitweg voor het hele gilde.'
