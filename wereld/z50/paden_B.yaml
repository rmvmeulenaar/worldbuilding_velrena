    schrijven zich in. Ronde na ronde, met water en olie ertussen en een snuif sporen omdat zaad niets meer doet, blijkt elke man iets anders te willen dan hij zei: praten, slapen, huilen, of de kok. Bij
    de zevende lacht het hele dorp mee, en Aaltje krijgt precies wat ze zocht.'
