    en soms gif. Neshra, Ishvar en zonder bijzonder bloed, schrijft de rol bij en weet wie wanneer bij hem slaapt. Gaandeweg ziet ze dat hij geen kluis zoekt maar een erfgenaam, en dat hij er nooit een
    zal verwekken. Dat schrijft ze niet op.
