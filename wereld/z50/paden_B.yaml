    gebruikte, belooft het één keer te doen. Om beurten vertellen ze de maanden erna: zijn opluchting, haar trillende handen als hij een dag weg is. Dan keert het. Zij leert hem zijn adem in te houden,
    en hij moet ontdekken dat hij zonder haar ook leeft.'
