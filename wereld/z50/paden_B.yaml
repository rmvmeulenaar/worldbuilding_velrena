    haar trots, op fluweel. Uit zijn brieven, die een dienstmeid onderschept, blijkt dat hij de Raad van de Laatsten vertelt welke van haar schepen de Aelthir naar de kust zullen varen. Imke leest ze allemaal,
    zegt niets, en zet de kooi open.
