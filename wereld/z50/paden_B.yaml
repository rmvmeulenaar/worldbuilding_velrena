  premisse: Jij ademt al drie jaar elke volle maan de sporen van Hesse in, en daarna hunker je twee dagen, zoals vrouwen vroeger naar een gaven-man. Hesse weet dat. Wie hem gehoorzaamt, krijgt sporen; wie
    vragen stelt, wacht. Zo regeert hij het eiland vanuit zijn keuken. Op jouw verzoek binden je vriendinnen je met zachte linten in de binnenhof en houden ze je vast tot de tweede zonsopgang. In die nacht
    proef je eindelijk wat hij door de sporen mengt.
