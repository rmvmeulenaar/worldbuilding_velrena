    op Edrik, een schrijver van de vorst die om haar sjerp lacht. Wanneer een hofdame hem opeist, daagt Brenna haar uit tot een duel naar Kaldra-gebruik, tot opgave. Edrik mag weigeren. Hij zegt ja, en
    het hof weet niet meer wie van wie is.
