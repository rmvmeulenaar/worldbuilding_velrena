  premisse: 'Brokke, smid met een Dhurn-grootvader, woont bij de poort waar een oude Tharn en een oude Dhurn al jaren kibbelen over wie de laatste is. Hij houdt van Gudrun, twee meter zeventig, met een
    Tharn-overgrootmoeder, die bang is hem te breken als ze op hem ligt. In één kamer, met de twee ruziemakers onder het raam, leren ze tellen: zijn adem, haar gewicht, drie klopjes op de vloer bij genoeg.
    Het lukt, en buiten horen de oude mannen alles.'
