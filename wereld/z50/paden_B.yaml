    waar vroeger vonk was. Saskia, dertig, geeft hem haar sjerp en haar naam en draagt zijn gegraveerde halsband; het woord Ysa-rust geldt elk uur. Op de vijfde dag betrapt hij haar in het archief, zoekend
    naar een moeder die daar ooit verdween. Hij laat haar zoeken en noteert niets.
