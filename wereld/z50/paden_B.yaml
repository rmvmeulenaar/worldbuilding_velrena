    hij bemanning, op een plek waar niemand mag komen. Eén knoop aan haar jas blijkt echt, en het schip begint te tellen. Vierhonderd tellen later vinden ze de knop die het stopt. De navigator heeft het
    gezien en biedt Lisanne een plaats. Ze weigert.
