  persoon: PER-Z50-b-wessel-oom
  premisse: 'Wessel giet al dertig jaar kaarsen in een dorp aan de mistrand. Neveth, een Aelthir, vraagt hem heet vet op haar huid te druppelen, omdat alleen hitte haar nog bereikt. Elke keer neemt de was
    een afdruk van haar rug, en hij zet die op een plank. Daarnaast houdt hij bij wat ze nog voelt: wol, adem, zijn duim. Dat lijstje wordt korter. Op een ochtend kijkt ze naar de afdrukken en vraagt ze
    hem wie hij is.'
