  persoon: PER-Z50-b-brenna-ostkaar
  premisse: 'Brenna Ostkaar, veldvrouwe uit een zijtak van Kaldra, rijdt met een kist zilver het kamp in van een Kharvos-heer die grensvrouwen gevangen houdt. De tolk vertelt later hoe de heer het zilver
    weigert en haarzelf als gijzelaar eist, en hoe Brenna toestemt om de anderen vrij te krijgen. De verdeling van gevangenen blijft dreiging aan de rand van het verhaal: gelabeld donker thema, nooit verheerlijkt.
    Dan draait het om, want de heer blijkt zelf gevangene van zijn eigen leger.'
