  persoon: PER-Z50-moeder-aurelie
  premisse: Moeder Aurelie is de laatste in Saelith die weet waarvoor de Zegelnacht dient. Het volk zingt elk jaar bij de stenen en denkt dat het dank brengt, maar wat het geeft, gaat naar de steen, net
    als bij de geheime voeding in de diepste zaal. Nu elk lichaam eerst ja moet zeggen, voelt ze dat als diefstal. We horen de toespraak die ze op de tempeltrap houdt voor de zang begint; hoeveel mensen
    daarna blijven, ziet ze pas als ze zwijgt.
