  persoon: PER-Z50-mareike-orlen
  premisse: 'Een lied uit de vrije stad Orlenhal: als de Bloedkerk de muren bestormt, houdt de stormman Haskel de poort met de laatste bliksem uit de Barsten. Daarna moet hij ontladen, anders verbrandt
    hij van binnen. Mareike, heelster van de stad, kiest te blijven en krijgt van hem het woord stil. De storm trekt door haar heen tot de dageraad. Hij geneest, maar een vleug van de bliksem blijft in
    haar handen achter, en vanaf die ochtend is hij een gewone man.'
