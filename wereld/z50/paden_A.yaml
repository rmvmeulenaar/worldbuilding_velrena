    voor haar deur, een van die mannen, nu vrij. Hij wil weten wat er toen met hem gebeurde en vraagt haar het opnieuw te doen, met zijn eigen ja. Ze sluiten de kamer af. De splinter bindt hem alleen zolang
    hij dat wil, en tegen de ochtend is zij degene die gehoorzaamt.
