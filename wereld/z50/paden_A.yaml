    mengt ze er gemalen glas door en liegt over de rest. Eén nacht, uur na uur verteld: een klant probeert haar waar in bed en roept bij de eerste schok het stopwoord van de Kharvos-grens. Hij is een spion,
    en de schokken die hij terugstuurt, zijn een bericht voor haar.'
