    Op een ochtend kijk je haar aan en zeg je dat ze langzamer moet. Ze doet het. De volgende dag zeg je wanneer ze moet stoppen, en de dag erna wanneer niet. Een week later staat zij met haar rug tegen
    de stalmuur en vraagt ze jou of het mag.
