  persoon: PER-Z50-corvin-aldeweer
  premisse: 'Corvin Aldeweer komt uit de fokstal van Varenne en is een van de laatste mannen met vonk, maar die vonk wordt elke maand dunner. Hij laat zich door zijn vrouw in boeien van zegelsteen sluiten,
    de sleutel bij de buurvrouw, omdat de vonk even terugslaat als de boeien afgaan. In zijn dagboek houdt hij bij hoe lang dat duurt: een uur, een kwartier, een ademhaling. Op een ochtend komt er niets
    terug, en hij weet niet of de steen het nam of de tijd.'
