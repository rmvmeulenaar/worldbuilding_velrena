- code: KINK-Z8-1
  nieuw: >-
    Bij de Myrrhen is de volle hand een vertrouwensrite: wie een hand helemaal toelaat, geeft zich over aan de ander. Ook de Saelith-vormhuizen kennen het spel, en daar verkopen vormers rekzalf aan wie te snel wil, want haast scheurt. Daarom gaat het met schimmelolie en langzaam tellen, en geldt het stopwoord van het eigen volk. Je voelt warme olie, druk die toeneemt en adem die meetelt. Het is biotechniek, geen gave. Een Myrrhen-priesteres, zegt men, weet daarbij waar het Zegel in je zit. Alleen volwassenen (18+) die echt instemmen; geen dieren, en dwang tussen volwassenen hoort alleen in een gelabeld donker thema.
- code: KINK-Z8-10
  nieuw: >-
    Liora draagt ze om haar ijskoude handen te verbergen, maar de glanshandschoen komt van de Aelthir, voor wie huidcontact taboe is. Ermee raak je iemand aan zonder dat huid huid raakt: koel, glad, beheerst. De afspraak is eenvoudig. Gaat de handschoen uit, dan begint de intimiteit. Het risico zit in het ding zelf, want wie zulke handschoenen draagt, verraadt Aelthir-afkomst. Het materiaal is gekweekt, biotechniek van de Langlevenden. Spel alleen tussen volwassenen (18+) met echte instemming, nooit met dieren, en dwang uitsluitend als gelabeld donker thema.
- code: KINK-Z8-11
  nieuw: >-
    Totale stilte en druk overal: zo voelt het om volledig omhuld te worden in zegelhars die op de huid uithardt. De vormhuizen bieden het aan, met zegelsteen als techniek. Bij de mond loopt altijd een snijlijn, zodat één haal met het mes de drager bevrijdt; zonder die lijn dreigt verstikking. Sommigen zien er kunst in, en een gevangene in hars, tentoongesteld als beeld, is een haak die verhalen trekt. Wie meedoet is volwassen (18+) en stemt echt in; dieren nooit, en dwang alleen als gelabeld donker thema.
- code: KINK-Z8-12
  nieuw: >-
    'Zout' is het woord waarmee een zeeman aan de Zoutkust alles stillegt, en een mes ligt altijd binnen bereik. Daar binden zeelieden elkaar met natte scheepstouwen, in knopen die elk een naam hebben. Het ruikt naar teer en zout, het touw is koud en zwaar van het water. Wie te lang of te strak bindt, riskeert zenuwschade. Er zit geen techniek in, alleen handwerk. Eén knoop kent alleen Jorrit, en wie hem wil leren, moet Jorrit vinden. Volwassenen (18+), echte instemming, geen dieren; dwang hoort enkel in een gelabeld donker thema.
- code: KINK-Z8-13
  nieuw: >-
    Hoog boven het dek, opgehangen in touwen aan de mast, voel je wind, deining en de diepte onder je. Zeelieden van de Zoutkust doen het nooit alleen: twee anderen houden toezicht, want vallen is het echte gevaar. Er komt geen techniek aan te pas, alleen want en knoop. En wie daar hangt, ziet meer dan de golven, want vanaf de mast zie je de smokkelaars die in de mist aanleggen. Alleen voor volwassenen (18+) die het zelf willen, nooit met dieren, en overmacht alleen als gelabeld donker thema.
- code: KINK-Z8-15
  nieuw: >-
    Een Dhurn-smid smeedt de boeien warm, van zwaar ijzer, en houdt zelf de sleutel. Zo spelen de Dhurn het bindspel: met gewicht om de polsen en metaalgeur op de huid. Blauwe plekken zijn de gewone prijs. Er zit geen techniek in, alleen smeedkunst van het bergvolk. Sommige boeien dragen de ingeslagen naam van een overleden geliefde, en wie ze om krijgt, draagt ook dat verdriet. Alle deelnemers zijn volwassen (18+) en stemmen in; dieren hebben geen rol, en dwang komt alleen voor als gelabeld donker thema.
- code: KINK-Z8-16
  nieuw: >-
    Het fluiten van het riet hoor je eerst, daarna komen de striemen en de warmte. De rietzweep was in Saelith een strafinstrument voordat ze lust werd, en de huizen houden haar nu voor wie dat verlangt. Er wordt hardop geteld; wie het tellen kwijtraakt, stopt. Bloed is de prijs als het misgaat. Techniek is er niet bij. In een bordeel hangt nog de strafzweep van een Moeder, en niemand weet hoe ze daar kwam. Uitsluitend volwassenen (18+) met echte instemming; geen dieren, dwang alleen gelabeld als donker thema.
- code: KINK-Z8-17
  nieuw: >-
    Wie linkshandig is, verraadt zich met de eerste klap. Slaan met de vlakke hand is het rauwe, intieme spel van geliefden en het komt overal in Velmara voor. Je voelt de klap en daarna de hitte die blijft. De afspraak is dat een rode huid genoeg is. Het risico is klein en er komt geen techniek aan te pas. Juist die eenvoud maakt het tot het meest gedeelde spel tussen minnaars. Het blijft tussen volwassenen (18+) die instemmen, zonder dieren, en dwang hoort alleen in een gelabeld donker thema.
- code: KINK-Z8-18
  nieuw: >-
    Een Karrûk-litteken is ook een kaart, voor wie het leert lezen. Tijdens seks snijden Karrûk elkaar sierlittekens, en dat mag alleen met een getuige-oudste erbij. Het ruikt naar bloed en ijzer, en de pijn hoort bij het genot. Infectie is de prijs van slordig werk. Techniek gebruiken ze niet, alleen het mes. Bij een krijgersvolk dat elke huid als archief draagt, vertelt iedere snede wie je nam en waar. Deelnemers zijn volwassen (18+) en stemmen echt in; dieren nooit, dwang alleen als gelabeld donker thema.
- code: KINK-Z8-19
  nieuw: >-
    Zachte bevelen in het donker, fluweel onder haar knieën: een vrouw van hoge rang in een Saelith-huis wil bevolen worden. Dat kan alleen in het donker, en er wordt nooit over gepraat. Komt het uit, dan volgt schandaal. Er is geen techniek bij nodig. Het gevaar zit in wat na bed overblijft, want haar onderdaan wordt buiten bed langzaam haar meester. Alleen volwassenen (18+) met echte instemming, geen dieren in enige rol, en dwang uitsluitend als gelabeld donker thema.
- code: KINK-Z8-2
  nieuw: >-
    Licht dat door de buik schijnt: zo zie je een Ishvar-hand die van binnen verwarmt. Ishvar-minnaars spelen dit alleen met een dimmende gloed, en het woord 'as' stopt alles. Het werkt via de gave, en de prijs is ernstig, want een te felle gloed geeft brandwonden van binnen. Je voelt een hitte die je nergens anders voelt. Liora's koude handen zijn er het omgekeerde van, en dat maakt de twee tot een tegenstelling die verhalen trekt. Volwassenen (18+) die echt instemmen; nooit dieren, dwang alleen als gelabeld donker thema.
- code: KINK-Z8-20
  nieuw: >-
    Voor één nacht beveelt de man. In een matriarchale wereld is dat het hele spel, en rebelse paren spelen het. De vrouw kiest welke nacht, zodat de omkering een gift blijft en geen greep. Wat je voelt zijn omgekeerde rollen, meer niet; techniek is er niet bij. De Orde noemt het opruiing en de Mannenraad gebruikt het als symbool, dus een slaapkamer wordt zo politiek. Het geldt alleen tussen volwassenen (18+) die instemmen, zonder dieren, en dwang slechts als gelabeld donker thema.
- code: KINK-Z8-21
  nieuw: >-
    Een man die in de banden glimlacht, maakt de priesteres onrustig. Bij dit Orde-ritueel wordt de gaven-man op de ontvangsttafel vastgebonden zodat de vrouw neemt, en de priesteres beslist wanneer het genoeg is. Er is leer, kaarslicht en gebed. Het werkt via de gave en het kost hem iets echts: de man raakt leeg. Daarom waakt de priesteres over hem en niet over haar. Ook hier zijn alle betrokkenen volwassen (18+) en stemt hij echt in; geen dieren, en dwang alleen als gelabeld donker thema.
- code: KINK-Z8-22
  nieuw: >-
    Gespen, leer en zweet: tuigen zijn harnassen die over het hele lichaam lopen, gedragen in de Wacht en in de vormhuizen. Elk tuig heeft een eigen betekenis, en wie het aantrekt, kent die afspraak. Schaafwonden zijn de prijs van een slecht passend tuig. Techniek zit er niet in. Eén tuig gaat rond in de verhalen, dat van een gevallen kapitein, en wie het draagt, krijgt zijn vijanden erbij. Alleen voor volwassenen (18+) die instemmen; geen dieren, en dwang uitsluitend als gelabeld donker thema.
- code: KINK-Z8-23
  nieuw: >-
    Hoefgeklak op de stenen, ijzer in de mond: bij de Kharvos-ruiters speelt een volwassen mens het 'paard', met bit en teugel. Gaat het bit uit, dan is het spel voorbij. Kaakpijn is de prijs van een lange rit. Er zit geen techniek in, maar de hoefijzers zijn van Harrow-metaal, en die zingen ook hier, zoals overal waar Kharvos komt. Het blijft een mensenspel: alle deelnemers volwassen (18+) en instemmend, nooit een dier in een seksuele rol, dwang alleen als gelabeld donker thema.
- code: KINK-Z8-24
  nieuw: >-
    Onder het masker kan de rivale staan. Op de maskerballen van Saelith geeft een masker van lak volledige anonimiteit, en wie het afzet, beëindigt het spel. Je ruikt lak en parfum, je leest alleen een blik. Daardoor raakt men in de war over wie wie is, en dat is precies het risico. Techniek is er niet. Het masker ontslaat niemand van de regels: volwassenen (18+) met echte instemming, geen dieren, en dwang alleen als gelabeld donker thema.
- code: KINK-Z8-25
  nieuw: >-
    Drie knipperingen, of een bal die je loslaat: dat is het teken, want met een knevel in de mond kun je geen stopwoord meer zeggen. Knevels van zoutzijde komen overal voor en maken van stilte een overgave. Zijde en speeksel, verder niets. Er is geen techniek bij. Een knevel kan ook een geheim smoren, en dan wordt het spel een verhoor of een redding. Volwassenen (18+) die echt instemmen; geen dieren, dwang alleen als gelabeld donker thema.
- code: KINK-Z8-26
  nieuw: >-
    Grijs betekent stop. Een blinddoek van Oevrin-stof laat in het donker de kleur zien van wie je aanraakt, en Oevrin en mensen gebruiken hem samen. Het is biotechniek uit het slik. Je ziet duisternis vol kleuren, en soms zie je wat je niet wilt zien. De blinddoek kan zelfs iemands leugen tonen, en wie hem ooit droeg, kijkt anders naar zijn minnaar. Alleen tussen volwassen (18+), sprekende wezens die instemmen; nooit dieren, en dwang alleen als gelabeld donker thema.
- code: KINK-Z8-27
  nieuw: >-
    Deze kooi ademt. De Myrrhen en de vormhuizen vlechten kooien van levende wortel, en de sleutel is een gezongen woord. Binnen ruik je hout en aarde en voel je warme adem uit het vlechtwerk. Het is biotechniek, en dus groeit het: laat je de kooi te lang staan, dan groeit ze dicht. Er gaan verhalen over een kooi die niet meer open wil. Alle betrokkenen zijn volwassen (18+) en stemmen echt in; dieren hebben geen rol, dwang uitsluitend als gelabeld donker thema.
- code: KINK-Z8-28
  nieuw: >-
    Wie in Saelith rijk is, laat het zien met een man in een versierde kooi van goud en fluweel. Hij zit er vrijwillig, is volwassen, en heeft zelf de sleutel. De prijs is vernedering in het openbaar, want iedereen ziet hem. Techniek is er niet bij. Maar de kooi staat midden in het huis en de man hoort alles, dus soms is de man in de kooi een spion. Volwassenen (18+) met echte instemming, geen dieren, en dwang alleen als gelabeld donker thema.
- code: KINK-Z8-29
  nieuw: >-
    Een vrouw die zaad verzamelt in flesjes, is in Velmara geen curiositeit maar een handelaarster. Zaad wordt gedronken, als zalf gesmeerd of geofferd, overal; gaven-zaad is het duurst. De ontvangstwet regelt wie mag geven en ontvangen. Het smaakt zout en warm en het plakt. Via de gave geeft het kracht, maar de prijs is de Leegte. Het spel geldt alleen tussen volwassenen (18+) die echt instemmen; nooit dieren, en dwang slechts als gelabeld donker thema.
- code: KINK-Z8-3
  nieuw: >-
    De Orde verbiedt het, en daarom gebeurt het. Priesteressen van de ontvangst brengen gaven-zaad met de hand diep in voor maximale kracht, aan de ontvangsttafel en onder gebed. Het ruikt naar zout, zaad en kaarsvet. De prijs is hoog: een overdosis kracht en daarna een dubbele Leegte. Het werkt via de gave. Wat verboden is, wordt in de kelders begeerd. Alleen volwassenen (18+) die echt instemmen, geen dieren in een seksuele rol, en dwang uitsluitend als gelabeld donker thema.
- code: KINK-Z8-30
  nieuw: >-
    Aan de Zoutkust trekken twee vrouwen lot om wie begint, en dan delen ze het zaad van één man: met mond, tong en een kus. Het werkt via de gave, en daarom wordt er geteld. Ruzie om wie het meeste kreeg is het gewone risico. Erger is wanneer de ene vrouw meer kracht kreeg en de ander het weet. Dan wordt een nacht een vete. Volwassenen (18+), echte instemming van alle drie, geen dieren; dwang alleen als gelabeld donker thema.
- code: KINK-Z8-31
  nieuw: >-
    Zoet en warm, en met een vleugje vonk: zo smaakt de melk van vrouwen die door vorming lacteren. De vormhuizen maken het mogelijk, alleen bij volwassen vrouwen en alleen vrijwillig, met een vormteken als bewijs van de afspraak. Het is biotechniek, en vorming kost altijd iets van het lichaam. Wat er in die melk zit, weet niemand precies, en juist dat vleugje vonk maakt haar gezocht. Alleen tussen volwassenen (18+) die echt instemmen; geen dieren, en dwang alleen als gelabeld donker thema.
- code: KINK-Z8-32
  nieuw: >-
    Achter het rooster hoor je adem en gekraak en zie je kaarslicht dansen. Priesteressen en leden van de Mannenraad kijken daar naar de ontvangst, en de afspraak is dat kijkers zwijgen. Ontdekking is het risico. Er is geen techniek bij. Wie keek, kan getuigen, en een getuige van een ontvangst is in Saelith goud waard of levensgevaarlijk. Iedereen achter en voor het rooster is volwassen (18+) en instemmend; geen dieren, dwang alleen als gelabeld donker thema.
- code: KINK-Z8-33
  nieuw: >-
    In de havenkroegen van Brakhaven gooi je een munt in de gleuf, en dan mag je kijken. Het ruikt er naar zweet, je hoort gefluister door het hout. Maar de kijker wordt zelf bekeken, en Sef verkoopt alles wat door die gaten te zien is. Techniek is er niet, alleen gaten in planken. Zo wordt een kroeg aan de Zoutkust een markt voor geheimen. Wie meedoet aan beide kanten van de wand is volwassen (18+) en stemt in; geen dieren, dwang alleen als gelabeld donker thema.
- code: KINK-Z8-34
  nieuw: >-
    Het plein onthoudt een naam. Op Saelithse feestdagen vindt de ontvangst in het openbaar plaats, met menigte, wierook en applaus, en alleen gewijden mogen deelnemen. Het werkt via de gave. De prijs komt later, als schaamte, wanneer de feestroes weg is en iedereen nog weet wie er lag. Zo wordt een heilige daad een stadsgesprek dat jaren meegaat. Alleen volwassenen (18+) die echt instemmen, geen dieren, en dwang alleen als gelabeld donker thema.
- code: KINK-Z8-35
  nieuw: >-
    Glans in de zon, en een hele straat die kijkt: Saelithse jongeren, allemaal volwassen, lopen in latexhuid door de stad. De Glanswet bepaalt wat mag, en wie haar overtreedt, betaalt boetes. De huid is biotechniek, gekweekt en strak. Eén parade liep uit op rellen, en sindsdien is elke optocht in glans een vraag aan de Wacht. Alle deelnemers zijn 18+ en kiezen het zelf; er spelen geen dieren mee, en dwang hoort alleen in een gelabeld donker thema.
- code: KINK-Z8-36
  nieuw: >-
    Tintelen, groei, spanning in de huid: in de vormhuizen laten minnaars delen van het lichaam zwellen of krimpen tijdens seks. Een vormmeesteres is scheidsrechter en bepaalt waar de grens ligt. Het is biotechniek, en het lichaam kan afstoting geven. Gevaarlijk wordt het met een minnaar die steeds verder wil, want de meesteres kan nee zeggen maar de lust niet stillen. Alleen volwassenen (18+) die echt instemmen; nooit dieren, en dwang slechts als gelabeld donker thema.
- code: KINK-Z8-37
  nieuw: >-
    Ze hoorde alles terwijl ze speelde. Een slimme vrouw speelt in de huizen voor één nacht dom en zacht, met giechelen, roze en parfum, en het stopwoord van het huis geldt gewoon. Er is geen techniek bij. Het risico zit in de tijd: als het spel blijft hangen na de ochtend, raakt ze iets van zichzelf kwijt. Maar wie haar onderschat, praat te veel. Alleen volwassenen (18+), echte instemming, geen dieren; dwang alleen als gelabeld donker thema.
- code: KINK-Z8-38
  nieuw: >-
    Een contract per seizoen legt het vast: de volwassen dienaar mag alles doen behalve beslissen. In de huizen kent men de stilte van zo'n dienaar, het knielen, het wassen van voeten en lijf. Er komt geen techniek aan te pas. Afhankelijkheid is de prijs, aan beide kanten. En de dienaar weet waar het geld ligt, wat een huis kwetsbaarder maakt dan zijn eigenares denkt. Volwassenen (18+) met echte instemming, geen dieren, dwang alleen als gelabeld donker thema.
- code: KINK-Z8-39
  nieuw: >-
    Warm water, zeep en zout: priesteressen wassen elkaar voor en na de ontvangst, in stilte, als dienst aan Ysa. Er is geen risico aan verbonden en geen techniek. Toch blijft er iets achter, want in het waswater blijft zaadkracht hangen, en wie het water weggiet of bewaart, maakt een keuze. Zo kan een reinigingsdienst een bron van smokkel worden. Alle betrokkenen zijn volwassen (18+) en stemmen in; geen dieren, en dwang alleen als gelabeld donker thema.
- code: KINK-Z8-4
  nieuw: >-
    Een plug die een naam fluistert, is geen gewoon speelgoed. In de vormhuizen rekt men geleidelijk op met ademend kweekvlees: warm, levend, pulserend. Er is elke dag een vaste maat en altijd een getuige. Het is biotechniek, en het vlees kan zich vasthechten als men te lang wacht. Welke naam het fluistert, en van wie die is, weet de vormer niet altijd. Uitsluitend volwassenen (18+) met echte instemming; geen dieren, en dwang alleen als gelabeld donker thema.
- code: KINK-Z8-40
  nieuw: >-
    Wie onderduikt, kiest. Zo gaat het in de gemengde zoutbaden van Brakhaven, waar de Zoutkust samenkomt in stoom en zout, naakt en zonder rang. Er is geen techniek bij. Het gevaar is drank, want dronken mensen verdrinken in het warme water. In een van de badhuizen dreef eens een lijk, en dat verhaal hoort nu bij de stoom. Alleen volwassenen (18+) die echt instemmen, geen dieren, en dwang uitsluitend als gelabeld donker thema.
- code: KINK-Z8-41
  nieuw: >-
    Eerst de koude kaarsen, die minder heet druipen. Pas daarna komen de hete, met hitte, rood vet op de huid en de geur van was. Priesteressen en huizen kennen dit spel, zonder techniek. Brandwonden zijn de prijs als men de volgorde overslaat. De was neemt een afdruk van de huid, en zo'n afdruk kan bewaard worden, lang nadat de minnaar vertrok. Volwassenen (18+), echte instemming, geen dieren; dwang hoort alleen in een gelabeld donker thema.
- code: KINK-Z8-43
  nieuw: >-
    Verboden door de Orde, omdat het kan doden, en toch gezocht. Toch beperken mensen in de Orde-kelders elkaars adem, voor de duizeling en de hartslag in de oren. Er is altijd een tweede persoon bij, en laat de hand los, dan stopt alles. Techniek is er niet. In een vormhuis viel eens een dode. Dit is een gelabeld donker thema: dwang en overmacht tussen volwassenen, met prijs en gevolg. Alle betrokkenen zijn 18+, en het gebeurt nooit met wie niet echt kan instemmen of met dieren.
- code: KINK-Z8-44
  nieuw: >-
    Kleine schokken uit vonkcellen, een tinteling die overgaat in een stoot: zo werkt het prikkeldraad van vonk. Ishvar en vormhuizen gebruiken het, en de dimmer ligt altijd in de hand van wie ontvangt. Het is biotechniek. De prijs is het hartritme, dat kan ontsporen. Soms draagt een schok een boodschap, in een ritme dat alleen de ontvanger leest. Alle deelnemers volwassen (18+) en instemmend; geen dieren, dwang alleen als gelabeld donker thema.
- code: KINK-Z8-45
  nieuw: >-
    Stenen die zoemen tot in je botten, tegen de huid gelegd: de Dhurn en de Orde kennen dit spel met zegelsteen. Wie stop wil, legt de steen af. Te lang en te vaak geeft zegelziekte, de ziekte die de mijnen al eeuwen kennen. De steen zoemt in het ritme van het hart in de groeve, en wie dat ritme eenmaal voelde, vergeet het niet. Alleen volwassenen (18+) die echt instemmen, geen dieren in enige rol, en dwang alleen als gelabeld donker thema.
- code: KINK-Z8-46
  nieuw: >-
    Een koude splinter, een zoemen, en dan een lege blik: zo bindt een Orde-agente een man tot gehoorzaamheid. Hier is geen echte instemming, en daarom is dit uitdrukkelijk een gelabeld donker thema: dwang en overmacht tussen volwassenen (18+), met prijs en gevolg, niet als genot verheerlijkt. Het werkt via zegelsteen. De man haat haar, en alleen Liora kan hem bevrijden. Dat is het Z7-moment waarop Liora haar gave vindt. Dieren en minderjarigen hebben in deze scène geen enkele rol.
- code: KINK-Z8-47
  nieuw: >-
    Ze wil terug, en dat is de haak. Smokkelaars houden een volwassen gijzelaar vast, en tussen gijzelaar en ontvoerder is macht de inzet. Wat ze afspreken is een onderhandeling, binnen een gelabeld donker thema: dwang en overmacht tussen volwassenen, met prijs en gevolg. Teer, duisternis en de deining van een ruim vullen de zinnen. Techniek is er niet; verraad is de prijs. Iedereen is 18+, er spelen geen dieren mee, en het donker blijft gelabeld.
- code: KINK-Z8-48
  nieuw: >-
    De koper is haar zus. Op de vlootmarkt van de Brakhaven-onderwereld wordt een volwassen schuldenaar geveild voor dienst, onder zon, menigte en ketting. Dit is een gelabeld donker thema met prijs: dwang en overmacht tussen volwassenen, met gevolg. Geen techniek, alleen ijzer en geld. Wat volgt is haat en wraak, en een familie die op een podium uit elkaar valt. Alle betrokkenen zijn 18+, dieren hebben geen rol, en het donker wordt nooit als ideaal getoond.
- code: KINK-Z8-49
  nieuw: >-
    De woorden werden opgeschreven, en daarmee begon de chantage. In een Saelithse kelder laat een Moeder zich vrijwillig uitschelden door een man; alleen daar, nooit boven. Een grof woord, zijn adem dicht bij haar. Er is geen techniek bij. Wat beneden een spel blijft, wordt boven een wapen zodra iemand een pen had. Uitsluitend volwassenen (18+) die echt instemmen, geen dieren, en dwang alleen als gelabeld donker thema.
- code: KINK-Z8-5
  nieuw: >-
    Ruikt naar hars en zweet, piept bij elke beweging en glanst: de zwarte glanshuid is gekweekte zegelhars, strak als een tweede huid. Saelith draagt hem, de Orde-agentes ook. Aantrekken gaat met olie; uittrekken moet voor de derde nacht, anders kan hij vastgroeien. Hitte-ziekte is het andere risico. Het is biotechniek. Er loopt een agente rond die hem nooit meer uit krijgt. Alle dragers en partners zijn volwassen (18+) en stemmen in; geen dieren, dwang alleen als gelabeld donker thema.
- code: KINK-Z8-50
  nieuw: >-
    Metaal dat warm wordt van de huid: een gegraveerde halsband als bezitteken, overal in Velmara gedragen. Gaat hij af, dan ben je vrij; zo luidt de afspraak. De prijs is een sociale stempel, want iedereen ziet van wie je bent. Er zit geen techniek in. Spannend wordt het bij een halsband met het teken van de Orde, want die roept vragen op die niemand hardop stelt. Volwassenen (18+), echte instemming, geen dieren; dwang alleen als gelabeld donker thema.
- code: KINK-Z8-51
  nieuw: >-
    Bij de Karrûk kies je zelf een ketting, voor één seizoen, en de oudste houdt de sleutel. IJzer om enkel of hals, de geur van roest aan je huid. Schaafwonden horen erbij. Techniek is er niet. Sommige kettingen gaan van hand tot hand, en er is er een die ouder is dan de Orde zelf. Wie die draagt, draagt een geschiedenis die de tempel liever vergeet. Volwassenen (18+) die vrijwillig instemmen; geen dieren, dwang alleen als gelabeld donker thema.
- code: KINK-Z8-52
  nieuw: >-
    Zand, zweet en tanden: twee Skerra worstelen tot een van beiden onder ligt. Een tik op de grond stopt het. Botbreuken zijn het risico, want Skerra hebben holle botten. Er is geen techniek bij. De verliezer kiest zelf de straf, en dat maakt verliezen bij dit vleugelvolk soms aantrekkelijker dan winnen. Alleen volwassen (18+), sprekende wezens met echte instemming; geen dieren, en dwang alleen als gelabeld donker thema.
- code: KINK-Z8-53
  nieuw: >-
    Een beet kan een contract zijn. Skerra en Vathren zetten hun tanden in nek en schouder, en zodra er bloed komt, is het genoeg. Tanden, zout en bloed op de tong. Infectie is de prijs. Er zit geen techniek in. Wie zo'n beet draagt, draagt een afspraak op de huid, en wie hem ziet, weet dat er iets beloofd is. Alle betrokkenen zijn volwassen (18+) en stemmen echt in; geen dieren, dwang uitsluitend als gelabeld donker thema.
- code: KINK-Z8-54
  nieuw: >-
    Muskus en dagen oud zweet: bij de Tharn is een ongewassen lichaam een prikkel. De Tharn bepalen hoe lang en hoe ver, niet hun gasten. Buiten de reuzen roept het sociale afkeer op. Er is geen techniek bij. Een geur blijft hangen en kan gevolgd worden, en zo leidde eens een geur naar een moordenaar. Alleen tussen volwassen (18+), sprekende wezens die instemmen; geen dieren, dwang alleen als gelabeld donker thema.
- code: KINK-Z8-55
  nieuw: >-
    In de roes spreekt de Wortel. Myrrhen-sporen maken alles intenser: paddenstoelengeur, zweet en kleuren die er niet zijn. Er is altijd een nuchtere getuige, want verslaving en hallucinaties zijn de prijs. Het is biotechniek, gegroeid uit het schimmelnet dat alles onthoudt. Wie de Wortel hoort, weet achteraf niet altijd wat er van hemzelf was. Volwassenen (18+) met echte instemming; geen dieren, en dwang alleen als gelabeld donker thema.
- code: KINK-Z8-56
  nieuw: >-
    Wie de laatste is, krijgt het meeste. Bij een groepsontvangst van de Orde liggen meerdere vrouwen bij één gaven-man, en de priesteres verdeelt. Kaarsen, gekreun, het hardop tellen van beurten. Het werkt via de gave, en de man betaalt de prijs: hij kan sterven van Leegte. Daarom is de volgorde politiek. Alle deelnemers zijn volwassen (18+) en stemmen echt in, ook hij; geen dieren, dwang alleen als gelabeld donker thema.
- code: KINK-Z8-57
  nieuw: >-
    Eens per jaar viert men overvloed op Ysa-dag, in Saelith en aan de Zoutkust. Wijn, zweet en muziek; wie meedoet, is volwassen en draagt een armband als bewijs. Jaloezie en zwangerschap zijn de prijs van het feest. Er komt geen techniek aan te pas. Tijdens een van die feesten viel een moord, en in de menigte zag niemand wie. Alleen volwassenen (18+) die echt instemmen, geen dieren, en dwang uitsluitend als gelabeld donker thema.
- code: KINK-Z8-58
  nieuw: >-
    Twee minnaars die van elkaar weten, delen één bed, en dat kan overal. Je hoort twee stemmen en voelt handen overal tegelijk. Het stopwoord geldt voor iedereen: zegt één het, dan stoppen alle drie. Jaloezie is het risico, en techniek is er niet. Soms is een van de twee een spion, en dan is het bed een post. Volwassenen (18+), echte instemming van elk, geen dieren; dwang alleen als gelabeld donker thema.
- code: KINK-Z8-59
  nieuw: >-
    Een uniformknoop die echt is, hoort niet in een verkleedkist. De Saelith-elite verkleedt zich als Makers uit oude reliefs, in uniformstof en met oude woorden. Het is blasfemie, dus het blijft geheim, en de prijs is een aanklacht wegens ketterij. Techniek gebruiken ze niet, maar die ene knoop is van een echte Maker. Alleen volwassenen (18+) die echt instemmen; geen dieren, dwang alleen als gelabeld donker thema.
- code: KINK-Z8-6
  nieuw: >-
    Zwart ertslak, op de huid gesmeerd, hard en spiegelend: de Dhurn maken het met zegelsteen. Het voelt koud, ruikt metalig en kraakt bij elke beweging. Wie stop wil, breekt de lak. De huid kan eronder niet ademen, en dat is het gevaar. Wie lang in de lak kijkt, ziet het verleden erin spiegelen. Volwassenen (18+) die instemmen; geen dieren, en dwang alleen als gelabeld donker thema.
- code: KINK-Z8-60
  nieuw: >-
    Plotse stilte in bed, en verwarring: iemand zei het stopwoord van een ander volk. Elk volk heeft zijn eigen woord, en wie het verkeerde gebruikt, verraadt zijn afkomst. Het kan overal gebeuren en vraagt geen techniek. De prijs is ontmaskering, en zo wordt een spion gevonden. Het woord werkt nog steeds: wie het zegt, wordt gestopt, wat het ook verraadt. Alleen volwassenen (18+), echte instemming, geen dieren; dwang alleen als gelabeld donker thema.
- code: KINK-Z8-7
  nieuw: >-
    Rode lak-uniformen dragen de speciale eenheden van Orde en Wacht, ook in bed. Rang bepaalt wie de rits opent. Ze ruiken naar hars en leer, en ze zijn biotechniek. Wie het pak draagt, is herkenbaar, en daarin zit het risico. Daarom is een vals pak zo gevaarlijk: het opent elke poort. Volwassenen (18+) met echte instemming; geen dieren, en dwang alleen als gelabeld donker thema.
- code: KINK-Z8-8
  nieuw: >-
    Alleen je eigen adem, het donker en geluid dat gedempt binnenkomt: een kap van glanshuid laat niets dan ademgaten open. Orde-kelders en vormhuizen gebruiken haar. Drie tikken betekenen stop. Ademnood is het gevaar. Het is biotechniek, en de kap houdt de geur van de vorige drager vast, zodat je weet dat je niet de eerste bent. Alle deelnemers volwassen (18+) en instemmend; geen dieren, dwang alleen als gelabeld donker thema.
- code: KINK-Z8-9
  nieuw: >-
    Hakken op steen, kraken van lak: in Saelith zijn laarzen tot de dij statussymbool en fetisj van rijke vrouwen. Wie ze groet, kust de laarzen. Slechte voeten zijn de prijs van die mode. Er is geen techniek bij. Ooit werden de laarzen van een Moeder gestolen, en daarmee begint een verhaal over wie ze nu draagt. Alleen volwassenen (18+) die echt instemmen, geen dieren, en dwang uitsluitend als gelabeld donker thema.
- code: RIT-afscheid-uitverkorene
  nieuw: >-
    Als een gaven-man sterft, vlucht of zijn gave verliest, komen in de tempel de vrouwen samen die hij gezegend heeft, met zijn huis en de Moeders. Het gebeurt één keer. In een stoet van goud spreekt elke vrouw een herinnering uit en legt een gouden oorring terug; de oorringen worden omgesmolten tot een beeld. Haar rang blijft, zijn kracht stopt, en zijn lijn wordt in het register gesloten. De rite staat op kink-schaal 2. Alle deelnemers zijn volwassen (18+).
- code: RIT-bloedverbinding
  nieuw: >-
    In het Bloedpaleis van Lisk bindt Morvane-ir zijn krijgsvrouwen aan zich. Er is geen heilig woord en geen toezicht: dit is een bewust donkere rite, een gelabeld donker thema. Een snede in de palm, zijn bloedgave, zaad en bloed gemengd, en de vrouw zweert hem trouw. Het draait om pijn en genot, totale binding en het ontbreken van een uitweg. De kracht is zesvoudig, boven de grens, maar de binding volgt direct, met zware Leegte, en de zegel krijgt er niets van. Kink-schaal 5; alle deelnemers 18+.
- code: RIT-boeterite
  nieuw: >-
    Drie Moeders leggen haar op. Een veroordeelde vrouw of man staat voor het tribunaal op de tempeltrappen, biecht in het openbaar en wordt in grijs gekleed. Daarna volgt dienst, als Ontvangster of in het stalhuis, tot de vrijspraak met zalving komt. Zolang de boete duurt, geeft zaad geen kracht. Wie de rite doorloopt, verliest rang en kan die terugkrijgen; het grijs is het teken dat iedereen op straat herkent. Alle deelnemers zijn volwassen.
- code: RIT-doorgang-duizend-handen
  nieuw: >-
    Een bel in haar hand bepaalt het tempo. In de stoomhal van Saelith loopt een geblinddoekte vrouw door een rij gemaskerde vrouwen, die haar zalven en strelen; ze mag niet zien wie. Een Hoedster houdt toezicht. Het gaat om anonimiteit, overprikkeling en een rite in groep. Kracht levert het niet op; het is een reiniging vóór een Ontvangst. Op de kink-schaal staat het op 3. Alle deelnemers zijn 18+, en zij alleen bepaalt hoe snel de handen gaan.
- code: RIT-duel-man
  nieuw: >-
    Een sjerp, toegeworpen, is de uitdaging. In het gebergte rond Kaldrun, en ook in de arena's van Qesh, vechten twee vrouwen om een man die instemt, onder getuigen. Het duel gaat tot opgave, niet tot de dood, en de man mag het weigeren. Ze strijden naakt of in leer. De winnares krijgt de nacht en stijgt in rang; de verliezer mag toekijken of vertrekken. Alle deelnemers zijn volwassen.
- code: RIT-geboortelied
  nieuw: >-
    Binnen drie dagen moet elk kind in het register staan. In de binnenhof of de tempel zingen de moeder en haar moederhuis het geboortelied, en de Registratrix leest het bloedlijnmerk. Het kind krijgt een naam; een jongen krijgt een zilveren belletje. De moeder stijgt in aanzien, en bij een jongen is de zegen groot. Deze rite is niet-seksueel: het gaat om geboorte en register. Alle deelnemers aan de rite zijn volwassen; het kind is er alleen als pasgeborene.
- code: RIT-gemaskerde-veiling
  nieuw: >-
    Op Isla Mirre en in Brakhaven biedt een vrouw of man zichzelf aan, voor één nacht en uit eigen keuze. Op het podium wordt zij of hij ontkleed tot het bod hoog genoeg is, en de gemaskerde koper blijft anoniem. De Mirre-wacht beschermt wie verkocht wordt. Het draait om anonimiteit, zelfverkoop en publieke vertoning, op kink-schaal 4. Het levert geld op, geen rang. Alle deelnemers 18+.
- code: RIT-gletsjerproef
  nieuw: >-
    Naakt in de kou van IJsgraf staan twee krijgsvrouwen, en wie het langst volhoudt, krijgt het zaad van de gaven-man. Een Moeder telt, en opgeven mag altijd. Het is een uithoudingsproef van pijn en verlangen, uit de tradities van Huis Kaldra. De winnares krijgt vijfvoudige kracht; de verliezer kijkt toe. Sneeuw, adem die bevriest en een Moeder die hardop telt. Kink-schaal 4. Alle deelnemers zijn 18+.
- code: RIT-gunstnacht
  nieuw: >-
    Een gouden lint, gestuurd door een gaven-man, betekent dat hij haar zelf kiest, buiten de wachtrij. Zij komt, of ze zendt het lint terug; weigeren mag, maar heeft een prijs. Er zijn geen getuigen. De nacht is in zijn vertrekken of in haar binnenhof, en in de ochtend volgt een geschenk. Voor haar en haar huis betekent het een grote stijging, en in de rij groeit jaloezie. Alle deelnemers zijn volwassen.
- code: RIT-halsbandoverdracht
  nieuw: >-
    Stil, zonder feest, wisselt een gewone man van eigenares. In de zaadbeurs of het moederhuis mag hij eerst een laatste nacht kiezen met wie hij wil, vaak met de oude eigenares. Daarna knipt men de halsband door en doet de nieuwe om, en de Registratrix schrijft het in. Kracht levert het niet op, maar zijn band met zijn oude kinderen blijft in het register bewaard. Kink-schaal 2. Alle deelnemers 18+; de kinderen komen alleen voor als erfenis in het register.
- code: RIT-halsbandwissel
  nieuw: >-
    Op de Nacht der Omkering draagt zij in het moederhuis zijn halsband, en hij haar sjerp. Hij beveelt. Het woord 'Ysa-rust' stopt alles, en het duurt één nacht. Het spel is rolomkering, dominant en onderdanig, op kink-schaal 3. Kracht geeft het niet, wel geheimen en wrok, want wat een gewone man één nacht beval, onthoudt hij nog lang daarna. Alle deelnemers 18+.
- code: RIT-ketenwake
  nieuw: >-
    Met zijden koorden aan een zuil in de tempelgalerij van Saelith, een hele nacht: zo wacht een vrouw (18+) die een gaven-man wil naderen buiten de rij. Ontvangsters raken haar aan en zalven haar, maar vervulling blijft uit. Een Ontvangster waakt, en het heilige woord 'Ysa-rust' stopt alles. Bij dageraad kiest de gaven-man haar of laat haar gaan. Houdt ze vol, dan stijgt ze één rang; kracht krijgt ze alleen als ze gekozen wordt. Bondage, uitstel tot de grens en getuigen; kink-schaal 4. Alle deelnemers 18+.
- code: RIT-kettingstoet
  nieuw: >-
    Door de straten van Ambergaard en Saelith trekt een stoet gewone mannen in halsband, geleid door hun Hoedsters. Langs de rij mogen vrouwen betasten en kiezen. Het is een ritueel van bezit, en schade is niet toegestaan. Het gaat om bezit, publieke vertoning en vernedering, en het eindigt in huur en verkoop. De stoet staat op kink-schaal 3, en wie langs de rij loopt, hoort de halsbanden tikken. Alle deelnemers zijn 18+.
- code: RIT-laatste-bed
  nieuw: >-
    Grijs is de kleur van de rouw. Bij de dood van een man of vrouw wordt het lichaam gezalfd, in de tempel of bij de brandstapel, en de vrouwen liggen een nacht om de dode heen. Liefde dient dan als troost onder de rouwenden zelf; de dode blijft buiten elke intimiteit en wordt alleen gezalfd en bewaakt. Bij het ochtendlicht volgt de verbranding. Wat overblijft, is rouw en troost onder elkaar. Alle deelnemers zijn volwassen en levend.
- code: RIT-leegtewake
  nieuw: >-
    Een vrouw in de Leegte mag tot zonsopgang van de tweede dag niets ontvangen. In de binnenhof bindt haar moederhuis haar vast met zachte linten, en vriendinnen troosten en plagen haar, met ontzegging tot de grens. Het gaat om ontzegging en kwetsbaarheid. Het breekt een beginnende binding, en wat zij daarna ontvangt, werkt tien procent sterker. Kink-schaal 3. Alle deelnemers 18+.
- code: RIT-maanzalving
  nieuw: >-
    Bij volle maan zalven de vrouwen van een moederhuis elkaar in de binnenhof met maankruidolie, en het maanlicht is het enige licht. Alleen vrouwen mogen erbij zijn. Er is liefde tussen vrouwen, en een zegen voor vruchtbaarheid of juist voor bescherming. De olie komt van het kruid dat in Groenmuil groeit. Zaad-kracht hoort er niet bij; de rite levert verbondenheid op. Alle deelnemers zijn volwassen.
- code: RIT-melkrite
  nieuw: >-
    Twee tot vier keer per dag gaan de stalhuizen van Ambergaard en Varenne open. Hoedsters en boerinnen wassen de gewone mannen, voeden hen met mannenvoer en melken hen met hand of mond. Het zaad gaat in flacons met het stalmerk, die verzegeld worden, en daarna volgt een ruststond. Het levert het huis inkomen op, en de flacons geven twintig procent kracht. Alle deelnemers zijn volwassen.
- code: RIT-melkzegen
  nieuw: >-
    Veertig dagen na de geboorte gaat een jonge moeder met haar huis naar het badhuis. Daar volgen bad en zalving, en ze legt de gouden sjerp af. Daarmee keert ze terug naar de rode sjerp van wie ontvankelijk is, en mag ze weer ontvangen. Het is een tedere rite, gericht op haar eigen lichaam; het kind speelt er geen rol in. Alle deelnemers zijn volwassen.
- code: RIT-nacht-duizend-lampen
  nieuw: >-
    Lampen in alle tempels en straten van Saelith: in deze nacht mag elke volwassen vrouw een man kiezen, en mannen mogen weigeren. Eerst ontsteekt men de lampen, dan volgt de optocht, de keuze en de nacht, en bij dageraad gaan de lampen uit. Even vallen de rangen weg, en er brandt veel zegellicht boven het water. Alleen volwassenen doen mee.
- code: RIT-ontvangst
  nieuw: >-
    Bad, zalving en sluier gaan vooraf. In de tempel, op het altaarbed, roept men Ysa aan; daarna kiest de vrouw (18+) met haar gunstbrief schoot, mond of huid, en ontvangt ze van de gaven-man, met Ontvangsters en getuigen erbij. Het mag alleen als de gaven-man en de vrouw allebei instemmen, en het zegellicht moet branden. Ze krijgt een oorring als teken van rang, en vijfvoudige kracht voor acht tot twaalf uur. Een deel van die kracht voedt de zegel; de zegen is van goud. Alle deelnemers volwassen.
- code: RIT-oogstbed
  nieuw: >-
    Eén week per jaar gaat in Ambergaard het stalhuis open. De dorpsvrouwen bepalen bij loting de volgorde bij de stalman; er is een oogstfeest en aan het einde dank aan de man. Het past bij de nuchtere boerinnencollectieven van het graanland, die samen één gewone man houden. Het brengt het dorp vruchtbaarheid en een kleine kracht voor de oogst. Alle deelnemers zijn volwassen.
- code: RIT-overdracht
  nieuw: >-
    Zeven dagen lang bepaalt hij haar kleding, haar rust en haar genot. Daarvoor tekenen een vrouw en een gaven-man een contract bij een Registratrix, en het woord 'Ysa-rust' blijft al die tijd geldig. In zijn vertrekken geeft ze hem haar sjerp en zegt ze haar naam af; bij afloop krijgt ze die terug. Het draait om totale machtsoverdracht, dominant en onderdanig. Haar huis stijgt sterk, maar het risico op binding is hoog. Kink-schaal 4. Alle deelnemers 18+.
- code: RIT-pelgrimszalving
  nieuw: >-
    Bij de grenspost van elke regio staat een Hoedster, en wie op een queeste verder reist, wordt door haar gezalfd. Ze vraagt naar het doel. Daarop volgt zegen of weigering, en met de zegen komt toestemming om door te reizen. Voor een reiziger is het de eerste vraag van een vreemde regio, en het antwoord bepaalt of de weg openblijft. Alle deelnemers zijn volwassen.
- code: RIT-reizigersgroet
  nieuw: >-
    Wie onderdak vraagt in een karavanserai, een haven of een berghut, biedt een gift of een nacht, en weigeren mag altijd. Eerst komen water en brood, dan toont de reiziger de sjerp, daarna volgt de gift of de nacht, en ten slotte een zegen voor de weg. Gezegende reizigers krijgen bescherming, en zo wordt de reis veiliger. Alle deelnemers zijn volwassen.
- code: RIT-rolwisseling
  nieuw: >-
    Eén dag per jaar, overal in het land, beveelt het bezit de bezitter. Op de Nacht der Omkering kiezen gewone mannen, en vrouwen dragen halsbanden; niemand wordt erom gestraft. Halsbanden en sjerpen wisselen van eigenaar, er is feest, en bij zonsopgang wisselt alles terug. Het laat geen blijvend effect na, alleen geheimen en wrok, die het hele jaar meegaan. Iedereen die meedoet is 18+.
- code: RIT-schandpodium
  nieuw: >-
    Een dag in grijs en halsband op het podium van de tempeltrappen: dat legt het Tribunaal van Drie een veroordeelde volwassene op. Het publiek mag kijken en spreken, een Moeder ziet toe, en blijvend letsel is verboden. Bij zonsondergang volgt de verheffing met zalving. Het gaat om publieke vernedering en verheffing: eerst rangverlies, daarna herstel. Kink-schaal 4. Alle deelnemers 18+.
- code: RIT-spiegelnacht
  nieuw: >-
    In Tuaro, de boomstad, laat een gaven-man met geestgave een vrouw zijn verlangen voelen, en zij hem het hare. De grens tussen twee lijven vervaagt. Het woord 'water' stopt de spiegeling. Het gaat om overweldiging en verlies van zelf. Onder de regen en tussen de hangbruggen voelt geen van beiden nog waar de ander begint. Ze krijgt viervoudige kracht, maar ook binding. Kink-schaal 3. Alle deelnemers 18+.
- code: RIT-stille-kind
  nieuw: >-
    Onder de vijgenboom van de binnenhof begraaft een moeder het belletje van haar zoon, of de naam van haar kind, als dat kind gestorven is. Ze draagt een grijze sjerp; het moederhuis zingt en rouwt mee. Veertig dagen lang geen zaad en geen ontvangst: de moeder is een tijd 'gesloten'. Dit is een niet-seksuele rouwrite. De kink-schaal van 2 slaat alleen op de onthouding die de volwassen moeder op zich neemt. Alle deelnemers 18+.
- code: RIT-stormontlading
  nieuw: >-
    Na grote magie moet Aeron-as ontladen, en dat kan overal gebeuren, na een gevecht. Een vrouw die vrijwillig blijft, kiest het zelf, en hij geeft haar het woord 'stil'. De storm trekt door haar heen in een woeste, ongecontroleerde nacht: overgave aan een overmatige kracht. Zij krijgt vijfvoudige kracht en een stormvleug; hij geneest, en de lucht ruikt nog uren naar onweer. Kink-schaal 4. Alle deelnemers 18+.
- code: RIT-strijdontvangst
  nieuw: >-
    Binnen zes uur vóór de slag, in een veldtent of de vestingzaal van Kaldrun, staan officieren en elite-krijgsvrouwen in een rij. Maankruid is verplicht. De wapens worden gezegend, en een of meer gaven-mannen ontvangen de vrouwen één voor één; daarna klinkt de strijdkreet. Het geeft krijgsrang en vijfvoudige kracht tijdens de slag, en daarna een gezamenlijke Leegte. Alle deelnemers zijn volwassen.
- code: RIT-tribunaal-drie
  nieuw: >-
    Drie Moeders oordelen in de tribunaalhal over een beschuldigde. Het bewijs komt uit het register: na de aanklacht vergelijkt men het bloedlijnmerk, dan volgt het oordeel, en de straf is een boete of de Boeterite. Blijkt er verwantschap, dan volgt verbanning of de dood. Zo bepaalt het tribunaal rang en straf. Het is een rechtsrite, geen seksuele. Alle deelnemers zijn volwassen.
- code: RIT-tweegelofte
  nieuw: >-
    'Ik keer altijd terug' is de gelofte. Twee volwassenen, twee vrouwen of een vrouw en een gewone man die zij bezit of vrijkoopt, ruilen in de binnenhof een haarlok en een ring, onder getuigen van het moederhuis. Ze baden samen en hebben een nacht alleen. Het is vrijwillig en niet exclusief, want het geloof verbiedt exclusiviteit, maar het belooft voorrang en terugkeer. Zaad-kracht levert het niet op, wel rang als paar in het moederhuis. Kink-schaal 2. Alle deelnemers 18+.
- code: RIT-veiling
  nieuw: >-
    Keuring in het bad, daarna het podium: op de zaadbeurs van Saelith, in Brakhaven en in Qesh brengt Huis Varenne gewone mannen te koop, soms ook een gaven-man die instemt. De mannen worden gekeurd en tentoongesteld. Kopers bieden met Kronen of gunstbrieven, en de winnares mag de man direct 'proeven'. Zij krijgt rijkdom en aanzien, en het gewone zaad geeft kleine kracht. Alle deelnemers volwassen.
- code: RIT-verzoening
  nieuw: >-
    Zout op de tong sluit de vete. Op voorstel van een Moeder komen twee rivalen, vrouwen of hele huizen, in het badhuis samen, onder een heilig woord. Ze wassen elkaar, eten samen en delen een nacht of een man. Daarna is de rang hersteld. Wie haat meebrengt in het water, merkt dat het moeilijk is om iemand te wassen en tegelijk te haten. Kink-schaal 2. Alle deelnemers 18+.
- code: RIT-volk-aelthir
  nieuw: >-
    Een Aelthir die binnen het uur klaarkomt, is onteerd; daarom duurt de Nacht van de Rekening uren. Eerst komt ontzegging tot de grens, daarna de geheugenruil, waarbij een herinnering wordt weggegeven voor één felle nacht. Het is een vorm van de extreme kern van de Langlevenden (zie SEKS-VOLK-aelthir-kern), op kink-schaal 5. Alleen volwassenen (18+) doen mee, sprekende wezens die vooraf instemmen, en een hoedster stopt de nacht wanneer het moet. Zo houdt het volk band en rang in stand. Geen minderjarigen, geen dieren; dwang alleen als gelabeld donker thema tussen volwassenen.
- code: RIT-volk-dhurn
  nieuw: >-
    In de schacht metselt het gilde een paar in, voor een nacht met beperkte lucht. Zo verzegelen de Dhurn een verbintenis, in de vorm van hun extreme kern (zie SEKS-VOLK-dhurn-kern), op kink-schaal 5. Buiten gildetoezicht is zoiets voor hen taboe; binnen het gilde is het heilig. Een hoedster houdt de muur in de gaten en breekt hem open als het moet. Alleen volwassenen (18+) die vooraf instemmen, sprekende wezens; geen minderjarigen en geen dieren. De rite houdt band, rang of voortplanting van het bergvolk in stand, en dwang komt alleen voor als gelabeld donker thema.
- code: RIT-volk-grauwen
  nieuw: >-
    Bij de Volle Ontsluiering laat een Grauwe elke vervorming zien, ook die hij zelf niet durft te bekijken, en de geliefde verkent ze met mond en hand. Het is de ritevorm van hun extreme kern (zie SEKS-VOLK-grauwen-kern), op kink-schaal 5. Voor een volk dat de Orde als schrikbeeld gebruikt, is gezien worden de hoogste gunst. Een hoedster stopt wanneer het te veel wordt. Alleen volwassenen (18+), sprekende wezens die vooraf ja zeggen; geen minderjarigen, geen dieren, dwang alleen als gelabeld donker thema. De rite houdt band en rang van het randvolk overeind.
- code: RIT-volk-ishvar
  nieuw: >-
    Een gloeiend goudstuk, in de huid gebrand op het moment van de climax: zo zweren Ishvar een eed. Geloftebrand is de rite die voortkomt uit hun extreme kern (zie SEKS-VOLK-ishvar-kern), op kink-schaal 5, en een derde in het bed zou de gelofte breken. De Ishvar voelen de Zegel niet, en hun eden dragen ze daarom in hun eigen huid. Een hoedster stopt als het moet. Deelnemers zijn volwassenen (18+), sprekend en vooraf instemmend; geen minderjarigen, geen dieren, dwang alleen als gelabeld donker thema. Het bewaart band en rang van het woestijnvolk.
- code: RIT-volk-karruk
  nieuw: >-
    Na het gevecht brandt het vuurkamp, en daar ontladen de Karrûk wat de strijd in hen opbouwde. Tedere seks zonder strijd ervoor geldt bij hen als laf. De rite is een vorm van hun extreme kern (zie SEKS-VOLK-karruk-kern), op kink-schaal 5, en ze werkt via de gave van de kookkoppen die moeten ontladen. Een hoedster houdt toezicht en stopt. Alleen volwassenen (18+), sprekende wezens die vooraf instemmen; geen minderjarigen, geen dieren, en dwang alleen als gelabeld donker thema. Zo blijven band en rang in het krijgersvolk heel.
- code: RIT-volk-kluwer
  nieuw: >-
    Drie nachten in de korfgeur van de Kluwers, zonder ik: een volwassen mens die instemt, voelt dan het genot van alle werksters tegelijk. Dat is de Korfopname, een vorm van hun extreme kern (zie SEKS-VOLK-kluwer-kern), op kink-schaal 5. Voor de korf is alleen-zijn een ziekte; opgenomen worden is genezing. Een hoedster haalt de mens eruit als het moet. Alleen volwassenen (18+), sprekende wezens die vooraf instemmen; geen minderjarigen, geen dieren, dwang alleen als gelabeld donker thema. De rite houdt de band van het korfvolk met de mensen in stand.
- code: RIT-volk-myrrhen
  nieuw: >-
    Verterend veen als bed, en zwam die over de huid groeit: het Rotbed van de Grote Draad is de rite van de Myrrhen, een vorm van hun extreme kern (zie SEKS-VOLK-myrrhen-kern). Kink-schaal 5. Vuur in de kamer is voor hen het grootste taboe, want het schimmelnet onthoudt alles wat erin leeft en sterft. Een hoedster waakt en stopt. Alleen volwassenen (18+) die vooraf instemmen, sprekende wezens; geen minderjarigen, geen dieren, en dwang alleen als gelabeld donker thema. Het houdt band en voortplanting van het sporenvolk in stand.
- code: RIT-volk-oevrin
  nieuw: >-
    'Eén poel, geen bezit.' Bij paaitij paren tientallen volwassenen tegelijk in de grote poel van de Oevrin, alle afscheiding gemengd. Het is de rite van hun extreme kern (zie SEKS-VOLK-oevrin-kern), op kink-schaal 5, en paren op het droge geldt voor dit slikvolk als taboe. Een hoedster houdt de rand van de poel en stopt wie stoppen moet. Alleen volwassenen (18+), sprekende wezens die vooraf instemmen; geen minderjarigen, geen dieren, dwang alleen als gelabeld donker thema. De rite draagt de voortplanting van de Oevrin.
- code: RIT-volk-orrim
  nieuw: >-
    Een Slijpvonnis begint met stof: twee Orrim slijpen elkaar uren, tot het stof hun kind wordt. In de Beeldnacht die volgt ligt een partner met steenpasta bedekt als heilig beeld, en wordt alleen naar afspraak aangeraakt. Beide horen bij de extreme kern van het steenvolk (zie SEKS-VOLK-orrim-kern), op kink-schaal 5. Een hoedster stopt de nacht als de huid te rauw wordt. Alleen volwassenen (18+), sprekende en vooraf instemmende wezens; geen minderjarigen, geen dieren, dwang alleen als gelabeld donker thema. Zo bewaren de Orrim voortplanting en rang.
- code: RIT-volk-saelmor
  nieuw: >-
    Op springtij, aan boord, paren de Sael-mor onder water tot op de rand van het verdrinken en brengen elkaar terug met een kus. Dat is de Springtij-verdrinkingsnacht, een vorm van hun extreme kern (zie SEKS-VOLK-saelmor-kern), op kink-schaal 5. Een hoedster met lucht in de longen blijft boven en stopt. Seks op het droge met één vaste partner geldt voor dit zeevolk als verraad aan het schip. Alleen volwassenen (18+), sprekende wezens die vooraf instemmen; geen minderjarigen, geen dieren, dwang alleen als gelabeld donker thema. De rite houdt de band van het schip in stand.
- code: RIT-volk-skerra
  nieuw: >-
    Pas na de achttiende verjaardag mag een Skerra de Eerste Val maken: de paarvlucht vanaf de kliffen, in vrije val, met loslaten op het laatste moment. Het is de rite van hun extreme kern (zie SEKS-VOLK-skerra-kern), op kink-schaal 5. Paren op de grond is voor het vleugelvolk taboe. Een hoedster vliegt mee en grijpt in als het moet. Alleen volwassenen (18+), sprekende wezens die vooraf instemmen; geen minderjarigen, geen dieren, dwang alleen als gelabeld donker thema. Zo kiezen de Skerra hun paar en houden ze hun band in stand.
- code: RIT-volk-tharn
  nieuw: >-
    Op de dijk die zijn volk ooit bouwde, kiest een Tharn een mens als gunst. Dat is de Dijknacht: een volwassen mens als heel lichaam in de hand van een reus, gespeeld en aanbeden, als vorm van de extreme kern van de Tharn (zie SEKS-VOLK-tharn-kern), op kink-schaal 5. Voor een stervend volk is het een eer om te geven, niet om te nemen. Een hoedster stopt. Alleen volwassenen (18+), sprekende wezens die vooraf instemmen; geen minderjarigen, geen dieren, dwang alleen als gelabeld donker thema. De rite bewaart band en rang van de reuzen.
- code: RIT-volk-vathren
  nieuw: >-
    Bij een lekpiek voelen de Vathren de Zegel als een jagende hartslag, en dan neemt een gezel meer zaad dan veilig is en brandt dagen in zegelkoorts. Dat is de Koortsontvangst, een vorm van hun extreme kern (zie SEKS-VOLK-vathren-kern), op kink-schaal 5. Zonder ziener erbij is het taboe, want men gelooft dat het de Zegel scheurt. Een hoedster stopt. Alleen volwassenen (18+), sprekende wezens die vooraf instemmen; geen minderjarigen, geen dieren, dwang alleen als gelabeld donker thema. De rite houdt band en rang van de zegelgeborenen in stand.
- code: RIT-volk-ves-lethi
  nieuw: >-
    Op verzoek neemt een Ves-Lethi de gedaante aan van een gewenste of verloren volwassene, van een levende alleen met diens toestemming: dat is hun Spiegelnacht, een donker thema van rouw en bedrog, en een vorm van hun extreme kern (zie SEKS-VOLK-ves-lethi-kern). Kink-schaal 5. De gedaante van een kind of dier aannemen is ook voor hen absoluut taboe en breekt hun lichaam. Een hoedster stopt. Alleen volwassenen (18+), sprekende wezens die vooraf instemmen; geen minderjarigen, geen dieren, dwang alleen als gelabeld donker thema. Zo houden de vormwisselaars band en voortplanting in stand.
- code: RIT-vuurgloed
  nieuw: >-
    In het Zonnepaleis van Qesh verwarmt Khaled-Ir met zijn vuurgave de huid van een haremvrouw tot de grens van pijn, en onder die gloed volgt de Ontvangst. Hij beheerst het vuur; zij kan 'zon' zeggen en dan stopt het. Het gaat om pijn en genot, gevaar en de macht van zijn gave. Ze krijgt vijfvoudige kracht en een vuurvleug, maar betaalt met een seizoen dienst. Kink-schaal 4. Alle deelnemers 18+.
- code: RIT-zaadcontract
  nieuw: >-
    Op de zaadbeurs onderhandelen twee huizen over huur of dekgeld, met een Registratrix als getuige. Het contract wordt bezegeld met zaad op het perkament: de man geeft het ter bevestiging, en het zegellicht bevestigt. Daarmee ontstaat handelsrecht, en wie het contract breekt, betaalt een boete. Zo wordt een lichaam een handtekening, en die handtekening een bewijs dat moeilijk te vervalsen is. Alle deelnemers volwassen.
- code: RIT-zegelnacht-volk
  nieuw: >-
    Elk jaar ontvangen alle volwassenen samen bij de zegelstenen, bij elke steen in het land tegelijk. Publiek heet het een dankfeest; in werkelijkheid is het de grootste voeding van de zegel. Er wordt samen gezongen, en het zegellicht vlamt op. Wie meedoet, krijgt geen kracht, want die gaat naar de zegel, maar wel veel rang. Kink-schaal 3. Alle deelnemers 18+.
- code: RIT-zegelvoeding
  nieuw: >-
    In de diepste tempelzaal van Saelith, en ooit in Ves-Anath, staat de zegelsteen waar eens per jaar de Grote Ontvangst plaatsvindt. Moeders, gaven-mannen en uitverkoren vrouwen nemen deel; het zaad wordt aan de steen afgestaan en het zegellicht vlamt op. Het is geheim, en alleen de Moeders kennen het doel. De ontvangers krijgen geen kracht, die gaat naar de zegel, en zo behouden de Moeders hun macht. Alle deelnemers volwassen.
- code: RIT-zwijgende-rit
  nieuw: >-
    Geen woorden, geen namen: bij de watervallen van Groenmuil blijven de maskers op en wordt het bloedlijnmerk bedekt, met het risico van verwantschap. Gemaskerde volwassenen beschilderen zich, nemen Vuurbloesem en dansen; in het donker vinden partners elkaar, tot zonsopgang. Het water overstemt elk geluid dat toch ontsnapt. Rang levert het niet op, wel bevrijding en geheimen. Alle deelnemers zijn volwassen.
- code: VOOR-afscheid
  nieuw: >-
    Na de Grote Pest van 340, toen een derde van de mannen stierf, leerde Velmara seks als afscheid en rouw. Oorsprong: GEB-pest-340. Deze voorkeur leeft in RIT-laatste-bed, RIT-afscheid-uitverkorene en RIT-halsbandoverdracht, en ze versterkt VOOR-teder. De intensiteit is laag, 2, en ze is geen taboe. Een laatste nacht met wie vertrekt of wie men verliest, is troost voor wie blijft. Het gebeurt alleen tussen volwassenen, en altijd tussen levenden.
- code: VOOR-anoniem
  nieuw: >-
    Niet weten wie je neemt. Toen in 290 de Stille vertrokken achter dichte deuren, kreeg het zwijgen een eigen lust. Oorsprong: GEB-stille-schisma. Je vindt het in RIT-zwijgende-rit, RIT-doorgang-duizend-handen en RIT-gemaskerde-veiling. Het botst met REGEL-verwantschapstaboe, want wie geen naam weet, kent ook geen bloedlijn, en in een land van registers is dat het echte gevaar. Een masker beschermt, maar het verbergt ook wie je verwant is. Intensiteit 3, geen taboe, en alleen tussen volwassenen.
- code: VOOR-binding
  nieuw: >-
    Trillende handen en een verlangen naar één naam: zo voelt de hunkering naar één gaven-man. Ze gaat terug tot de erkenning van de Uitverkorenen in 210, al bestonden erfelijke gaven al sinds 85. Oorsprong: GEB-uitverkorenen-210, bijgesteld in GEB-uitverkorenen-210-Z6. Ze hoort bij RIT-ontzegging-binding, RIT-bloedverbinding, MAGIE-verslaving en PER-morvane, en botst met VOOR-teder. Intensiteit 5, taboe. Een gebonden vrouw herkent de stap van haar man op straat, en haat dat (HAAK-Z1-derdeweg-3). In de wereld laat ze binding voelen als verslaving, alleen tussen volwassenen.
- code: VOOR-bloed
  nieuw: >-
    Op de tegels van de raadszaal in Lisk lag in 788 het bloed van priesteressen, en sindsdien heeft bloed delen als band een donkere klank. Oorsprong: GEB-bloednacht-788. Het hoort bij RIT-bloedverbinding, PER-morvane en REG-saelith. Het staat op de rand van het taboe, geldt ook als taboe, en botst met VOOR-teder. Intensiteit 5. Wie het speelt, doet dat alleen tussen volwassenen en weet dat het een donkere voorkeur is.
- code: VOOR-bondage
  nieuw: >-
    Zijde, ketting of linten: het spel van vastgebonden worden stamt uit de tijd na de pest, toen de overlevende mannen ineens onbetaalbaar waren. Oorsprong: GEB-pest-340. Het leeft in RIT-ketenwake, RIT-leegtewake en RIT-zegelbinding, en het versterkt VOOR-overgave. Intensiteit 4, geen taboe. Wie eens in een binnenhof met zachte linten lag, weet hoe dun het verschil tussen zorg en bezit is. Alleen tussen volwassenen.
- code: VOOR-competitie
  nieuw: >-
    Vechten om de man of om het genot hoort bij de tijd van de markt, toen mannen schaars en duur werden. Oorsprong: FASE-markt. Huis Kaldra (HUI-kaldra) maakte er een kunst van in RIT-duel-man en RIT-gletsjerproef. Het versterkt VOOR-voyeurisme, want wie strijdt, heeft toeschouwers. Intensiteit 3, geen taboe. Alleen tussen volwassenen, en opgeven mag altijd. Een sjerp in de sneeuw is in Kaldrun een uitdaging die niemand licht neemt.
- code: VOOR-dominante-man
  nieuw: >-
    De lucht van vonk hangt in de kamer als hij een bevel geeft. Sinds de vonk bestaat (FASE-vonk is de oorsprong) zijn er gaven-mannen die met hun gave bevelen, en die lust leeft in RIT-vuurgloed, RIT-stormontlading en RIT-ontzegging-binding, bij PER-morvane en PER-khaled. Ze botst met VOOR-dominante-vrouw. Intensiteit 4, geen taboe. Een vrouw die zich graag laat bevelen, ontdekt dat zij de echte macht heeft (HAAK-REG-stille). In de wereld maakt het dominantie een spel, alleen tussen volwassenen.
- code: VOOR-dominante-vrouw
  nieuw: >-
    Een sleutelbos die rammelt, leer om de heupen: vrouwen die mannen bezitten en bevelen. Het begon met de Deelwet van het jaar 40, toen elke man vele vrouwen moest bevruchten. Oorsprong: GEB-deelwet-40. Deze voorkeur woont in RIT-melkrite, RIT-kettingstoet en RIT-veiling, en bij HUI-varenne. Ze versterkt VOOR-melken en botst met VOOR-overgave. Intensiteit 3, geen taboe. Een vrouw die mannen bezit, ontdekt dat één van hen haar bezit (HAAK-B1-5-4). Zo keert de wereld macht om, alleen tussen volwassenen.
- code: VOOR-exhibitionisme
  nieuw: >-
    Gezien worden begon met een tempel die verstijfde van stilte, in 130, toen de stenen onder een Ontvangst opgloeiden. Oorsprong: GEB-eerste-zegellicht. Sindsdien hoort publieke seks met getuigen bij RIT-ontvangst, RIT-schandpodium, RIT-gemaskerde-veiling en de sfeer van SFEER-tempels-verleidingspaleizen. Wat eerst een wonder was, werd een vertoning, en wie gezien wordt, wordt ook onthouden. Het versterkt VOOR-voyeurisme. Intensiteit 3, geen taboe, alleen tussen volwassenen.
- code: VOOR-geest
  nieuw: >-
    Elkaars genot voelen zonder aanraking, via de geestgave: het gaat terug op Orric, de eerste vonkdrager, in het jaar -150. Oorsprong: GEB-orric-vonk. Het hoort bij RIT-spiegelnacht en REG-groenmuil, raakt aan SEKS-VOLK-aelthir-koelen, en versterkt VOOR-teder. Intensiteit 3, geen taboe. Toch is het gevaarlijk, want twee volwassen geliefden voelen via de geestgave ook elkaars geheimen (HAAK-B1-3-3). Zo maakt de wereld intimiteit riskant, alleen tussen volwassenen.
- code: VOOR-gevangenschap
  nieuw: >-
    Hoeven en rook boven de grensdorpen, in 720: de eerste grote Kharvos-inval maakte overmacht door een vijand tot een angst die tot in bed doordringt. Oorsprong: GEB-kharvos-720. Het is uitsluitend een gelabeld donker thema, niet verheerlijkt, en het hoort bij RIT-kharvosrite en REG-kharvos. Het is taboe en alleen als dreiging aanwezig, een schaduw over de grens bij de Amberpas. Intensiteit 5. Uitsluitend tussen volwassenen, en nooit als iets om naar te verlangen.
- code: VOOR-groep
  nieuw: >-
    Lampen, gezang en veel adem in één zaal. Velen tegelijk of na elkaar is in Velmara geen uitspatting maar een erfenis van de Deelwet. Oorsprong: GEB-deelwet-40. Het hoort bij RIT-zevenvoudige-ontvangst, RIT-strijdontvangst, RIT-nacht-duizend-lampen, RIT-zegelnacht-volk en RIT-zegelvoeding, en het versterkt VOOR-overvloed. Intensiteit 4, geen taboe. In een groepsrite verdwijnt één persoon, en niemand ziet wie (HAAK-B1-1-2). Zo wordt elke groepsrite een decor voor intrige, alleen tussen volwassenen.
- code: VOOR-handel
  nieuw: >-
    Een contract op tafel en een handdruk. Sinds Huis Varenne in 455 de handel in mannen organiseerde, is seks als contract een zakelijke, openlijke ruil. Oorsprong: GEB-zaadbeurs-455. Je ziet het in RIT-zaadcontract, RIT-tribunaal-drie en KINK-betalen-met-lichaam; het versterkt VOOR-veiling. Intensiteit 2, geen taboe. Soms wordt een ruil persoonlijk, en het contract heeft geen clausule voor liefde (HAAK-V5-zegel-6). Zo maakt de wereld van elke overeenkomst een intrige, alleen tussen volwassenen.
- code: VOOR-harem
  nieuw: >-
    Dingen naar de gunst van één heerser werd een stijl toen Khaled-Ar in 512 de Orde weigerde en Qesh stichtte. Oorsprong: GEB-qesh-512. Het leeft in KINK-harem-gunst, RIT-vuurgloed en HUI-qesh, en bij PER-khaled, en het versterkt VOOR-competitie. Intensiteit 3, geen taboe, alleen tussen volwassenen. In de hitte van het zonnepaleis is rang wat je gisteren kreeg en morgen kwijt kunt raken.
- code: VOOR-lichaam
  nieuw: >-
    Krijgsvrouwen, rijpe moeders, slanke zeevrouwen, zware boerinnen: elk lijf heeft een eigen eer. Die eer is ouder dan de mode en gaat terug op de Deelwet. Oorsprong: GEB-deelwet-40. Je vindt haar in MODE-per-regio en in RIT-melkzegen, RIT-stille-kind en RIT-geboortelied; die laatste twee zijn niet-seksuele riten van rouw en geboorte. Ze staat voor diversiteit, met intensiteit 1, en is geen taboe. Waar het om lust gaat, alleen tussen volwassenen.
- code: VOOR-melken
  nieuw: >-
    Appelgeur van koorts in de mannenvertrekken, in 340, en daarna stallen vol overlevenden die ineens onbetaalbaar waren: zo begon de opwinding van het melken en verzamelen. Oorsprong: GEB-pest-340. Ze hoort bij RIT-melkrite, RIT-zaadcontract, REG-ambergaard en PER-gewone-mannen, en versterkt VOOR-dominante-vrouw. In Ambergaard heet het werk, in de stad heet het lust, en de flacons met stalmerk gaan van hand tot hand. Intensiteit 3, geen taboe, alleen tussen volwassenen.
- code: VOOR-onderdanige-man
  nieuw: >-
    Een man die zich laat bezitten en sturen, is in Velmara geen uitzondering sinds de pest de mannen schaars maakte. Oorsprong: GEB-pest-340. Je kent hem uit RIT-melkrite, RIT-kettingstoet en RIT-halsbandoverdracht, en uit PER-gewone-mannen. Zijn lust versterkt VOOR-dominante-vrouw. Intensiteit 3, geen taboe, alleen tussen volwassenen. Wie zich zo geeft, kiest dat zelf, en houdt in zijn eigen stilte iets wat zijn eigenares niet bezit.
- code: VOOR-ontlading
  nieuw: >-
    Vonkdragers die niet ontladen, worden gek; in het jaar -60 brandden er steden om. Oorsprong: GEB-vonkkoorts. Daaruit groeit de voorkeur voor de overladen man: een gaven-man die moet ontladen en haar daarvoor nodig heeft. Ze hoort bij RIT-stormontlading, KINK-ontlading-na-magie en PER-aeron, en versterkt VOOR-overgave. Intensiteit 4, geen taboe. Alleen tussen volwassenen, en zij kiest of ze blijft. Wie de storm in zich draagt, heeft een ander nodig om niet zelf een stad te worden die brandt.
- code: VOOR-ontzegging
  nieuw: >-
    Adem die stokt, genot uitgesteld tot de grens. Na de pest werd zaad schaars, en wachten werd een kunst. Oorsprong: GEB-pest-340. De voorkeur leeft in RIT-ketenwake, RIT-leegtewake, RIT-ontzegging-binding en RIT-boeterite, en versterkt VOOR-overgave. Intensiteit 4, geen taboe. Een ontzegging die te lang duurt, wordt een wapen (HAAK-techno-gave-3). In de wereld maakt het uitstel spannend, alleen tussen volwassenen. Wie wacht, telt de uren, en wie laat wachten, telt de macht.
- code: VOOR-oudere-vrouw
  nieuw: >-
    Toen de Zusters in het jaar 90 priesteressen werden in Saelith, kregen oudere, ervaren vrouwen de leiding. Oorsprong: GEB-orde-90. Hun aanzien klinkt door in RIT-zilverwake, RIT-pelgrimszalving en RIT-tribunaal-drie. Een Moeder met grijs haar is in Velmara geen voorbije schoonheid maar een macht. De rijpe vrouw staat voor diversiteit in leeftijd onder volwassenen, met intensiteit 2, en is geen taboe. Lust rond haar hoort alleen tussen volwassenen.
- code: VOOR-overgave
  nieuw: >-
    De stilte van overgave aan een sterkere partner. Zich volledig geven werd heilig toen de gave in 210 goddelijk werd verklaard. Oorsprong: GEB-uitverkorenen-210, bijgesteld in GEB-uitverkorenen-210-Z6. Het hoort bij RIT-overdracht, RIT-ketenwake, PER-liora, PER-liora-Z6 en PER-khaled. Het versterkt VOOR-ontzegging en botst met VOOR-dominante-vrouw. Intensiteit 4, geen taboe. Liora geeft zich over en neemt daarmee de kracht (HAAK-V5-zegel-2). Zo wordt overgave een omkering van macht, alleen tussen volwassenen.
- code: VOOR-overvloed
  nieuw: >-
    Bedekt of gevuld worden met zaad, tot het teveel aan kracht voelbaar wordt. In het jaar -120 merkten de vrouwen rond Orric dat ze sterker werden na seks met hem, en daar begint het. Oorsprong: GEB-zaadkracht-ontdekt. De voorkeur hoort bij RIT-zevenvoudige-ontvangst en MAGIE-kracht-duur, en versterkt VOOR-groep. Intensiteit 4, geen taboe, alleen tussen volwassenen. Zo begon in een mijnstreek wat later een tempelleer werd: kracht die je kunt ontvangen.
- code: VOOR-pijn-genot
  nieuw: >-
    Hitte, kou, snede of druk als prikkel. De koorts van de vonkdragers, in -60, leerde Velmara dat pijn en genot in hetzelfde lichaam wonen. Oorsprong: GEB-vonkkoorts. Je vindt het in RIT-vuurgloed, RIT-gletsjerproef en RIT-bloedverbinding, en bij PER-khaled. Het versterkt VOOR-overgave. In Qesh zegt men dat de zon eerst brandt en dan pas verwarmt. Intensiteit 4, geen taboe, alleen tussen volwassenen.
- code: VOOR-reiziger
  nieuw: >-
    Eenmalig, met een vreemdeling: de nacht met een reiziger kreeg vorm in de tijd van de markt, toen wegen en handel opengingen. Oorsprong: FASE-markt. Je vindt het in RIT-reizigersgroet, RIT-pelgrimszalving en QST-etappes-queeste, en het versterkt VOOR-anoniem. Intensiteit 2, geen taboe. Wie morgen verder trekt, neemt geen naam mee en laat geen schuld achter. Een karavanserai onthoudt de gift, niet het gezicht. Alleen tussen volwassenen.
- code: VOOR-ritueel
  nieuw: >-
    Wierook en gezang. Seks als gebed en ceremonie kreeg vorm toen de Zusters in 90 priesteressen werden. Oorsprong: GEB-orde-90. Het hoort bij RIT-ontvangst, RIT-wijding, RIT-pelgrimszalving, RIT-zegelnacht-volk en ORDE-orde, en versterkt VOOR-exhibitionisme. Intensiteit 2, geen taboe. Een rite blijkt het Zegel te voeden, en de deelnemers weten het niet (HAAK-B1-3-2). Zo verbindt de wereld seks met het geheim van het Zegel, alleen tussen volwassenen.
- code: VOOR-rolwissel
  nieuw: >-
    Bezit en bezitter ruilen. Waar de Deelwet vastlegde wie wie toebehoort, ontstond ook de lust om dat een nacht om te keren. Oorsprong: GEB-deelwet-40. Deze voorkeur leeft in RIT-rolwisseling en RIT-halsbandwissel en bij PER-gewone-mannen; ze versterkt VOOR-dominante-vrouw, maar dan omgekeerd. Intensiteit 3, geen taboe, alleen tussen volwassenen. Wat bij zonsopgang terugwisselt, blijft als herinnering tussen hen in hangen, en een halsband weet wie hem één nacht droeg.
- code: VOOR-teder
  nieuw: >-
    Een langzame hand en één vaste naam. Tederheid en trouw komen uit de Zusterburcht van Ves-Anath, in -220, waar gevluchte haremvrouwen zelf een vesting bouwden. Oorsprong: GEB-zusterburcht. Ze leeft in RIT-tweegelofte, RIT-gunstnacht, RIT-spiegelnacht en RIT-melkzegen, bij PER-aeron en PER-liora, en botst met VOOR-binding. Intensiteit 1, geen taboe. Toch is tederheid met één partner ketterij, en daarom gevaarlijk (HAAK-techno-gave-3). Dit geeft de romance haar kern, alleen tussen volwassenen.
- code: VOOR-uithouding
  nieuw: >-
    Zo lang mogelijk volhouden. In de schaarste na de pest werd elke nacht gerekt, en uithouding werd een deugd. Oorsprong: GEB-pest-340. Je ziet het in RIT-gletsjerproef, RIT-zevenvoudige-ontvangst en RIT-strijdontvangst; het versterkt VOOR-ontzegging. Intensiteit 4, geen taboe. Wie het langst blijft staan in de kou van IJsgraf, wint het zaad. Een Moeder telt, en wie opgeeft, verliest alleen de nacht. Alleen tussen volwassenen.
- code: VOOR-veiling
  nieuw: >-
    Roepende handelaarsters, prijzen op lei: sinds 455 laat men zich bieden, keuren en kopen. Oorsprong: GEB-zaadbeurs-455. Het hoort bij RIT-veiling, RIT-gemaskerde-veiling, HUI-varenne en HUI-mirre, en versterkt VOOR-exhibitionisme. Huis Varenne zette een prijs op een man, en de prijs werd een wet. Op Isla Mirre draagt de koper een masker, op de beurs van Saelith niet. Intensiteit 3, geen taboe, alleen tussen volwassenen.
- code: VOOR-verboden
  nieuw: >-
    De kou van een plek buiten de tempel. Heimelijk ontvangen, weg van de Orde, groeide in de tijd van de markt. Oorsprong: FASE-markt. Het hoort bij KINK-verboden-toegang, REG-zoutkust en RIT-tweegelofte, en botst met ORDE-orde. De eilanden die rond 100-130 de rotatie weigerden, gaven het een zwarte markt (GEB-r10-eilanden-weigering). Intensiteit 3, geen taboe. Ontvangen buiten de tempel maakt een vrouw sterker en verraadt haar (HAAK-B1-5-1). Zo wordt elke verboden plek een risico, alleen tussen volwassenen.
- code: VOOR-vernedering
  nieuw: >-
    Val en herstel in het openbaar zijn zo oud als de Orde zelf, die in 90 de Zusters tot priesteressen maakte. Oorsprong: GEB-orde-90. Het hoort bij RIT-schandpodium, RIT-boeterite en RIT-verzoening, en versterkt VOOR-exhibitionisme. Intensiteit 4, geen taboe, alleen tussen volwassenen. Wie op de tempeltrappen in grijs stond, weet dat de zalving bij zonsondergang zoeter is dan elke rang, en dat het publiek dat van de ochtend ook 's avonds terugkomt.
- code: VOOR-voyeurisme
  nieuw: >-
    Kijken naar anderen begon met priesteressen die in 130 zagen hoe de stenen opgloeiden, en beseften dat ze iets konden bedienen. Oorsprong: GEB-eerste-zegellicht. Je vindt het in RIT-ontvangst, RIT-duel-man en RIT-oogstbed, en het versterkt VOOR-exhibitionisme. Intensiteit 2, geen taboe, alleen tussen volwassenen. Wie toekijkt, is getuige, en een getuige weet soms meer dan wie er lag. Achter elk rooster in Saelith zit iemand die onthoudt.
- code: VOOR-vrouwenliefde
  nieuw: >-
    Zachte stemmen en handen onder elkaar. Liefde tussen vrouwen is in Velmara dagelijks en heilig, sinds de Zusterburcht van Ves-Anath. Oorsprong: GEB-zusterburcht. Ze leeft in RIT-maanzalving, RIT-laatste-bed en RIT-doorgang-duizend-handen, bij REG-stille en PER-bondgenoten, en versterkt VOOR-teder. Intensiteit 2, geen taboe. Haar haak zijn Ysara en Mira, de nacht voor het Offer (HAAK-REG-hoogvrouwe). Zo wordt liefde tussen vrouwen alledaags en heilig tegelijk, alleen tussen volwassenen.
