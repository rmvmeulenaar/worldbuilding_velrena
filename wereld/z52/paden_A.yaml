  premisse: 'Onder de groeve van Hoogvrouwe loopt een ader Sterrensteen die alleen de Dhurn kennen, en Garra Steenvoeler laat haar uithakken door
    vijf mannen die niet meer naar boven gaan. Wie het steen te lang vasthoudt, krijgt steenkoorts: blaren in de handpalmen, dromen die doorpraten
    na het ontwaken. Garra betaalt met stof en met haar eigen lichaam in de mijnbaden, waar de koorts hun huid zo heet maakt dat het water sist.
    Haar lijst begint met vijf namen. Elke maand streept ze er een door en metselt zijn gang dicht. De laatste naam is van de man van wie ze houdt.'
