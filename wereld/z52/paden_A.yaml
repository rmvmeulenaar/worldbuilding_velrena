  premisse: 'Haar waarschuwing over kleine bevolkingen ligt in een logboek dat sinds het schriftverbod niemand meer opent, dus draagt de genetica
    van de Ysa haar in haar eigen buik het veen in. De slapeloze kolonist en zijn dertig volgelingen trouwen alleen onderling; zij biedt vers
    bloed in ruil voor een plaats aan het vuur, en kiest drie mannen met natte huid en veenrook in hun haar. Haar lichaam vertelt: de misselijkheid,
    de zwelling, de eerste schop. Haar dochter wordt gezond geboren. De zeven baby''s die daarna in de groep komen, hebben grijze huid en vergroeide
    vingers, en zij weet waarom.'
