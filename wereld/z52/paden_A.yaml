  premisse: In de Zusterburcht van Ves-Anath snijdt Ildra Steenzuster haar duim open boven een splinter Sterrensteen, en die gloeit als ze aan
    Wenne denkt. Wenne, uit de keuken, laat zich ook snijden, eerst uit nieuwsgierigheid, dan uit liefde. Ze vrijen met het steen tussen hun buiken,
    en het licht schijnt door hun huid. Ildra beschrijft elke proef in brieven aan de oudste Zuster, die terugschrijft dat zulke lust zonde is
    en om meer bloed vraagt. Wenne wordt grauw, haar tandvlees wijkt, haar haar blijft in de kam. Op het kapittel leest de oudste de brieven voor
    als aanklacht en noemt de vondst de hare.
