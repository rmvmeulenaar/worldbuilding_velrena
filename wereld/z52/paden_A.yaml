  premisse: 'Zeventien jaar na haar eerste strijdnacht steelt Hanne Strijdvrouw Grijswortel uit de legervoorraad, voor twaalf gebonden krijgsvrouwen
    die niet meer slapen zonder een man met vonk. In een visserskeet zweten ze negen dagen: koorts, krampen, een honger die als zand onder de
    huid schuurt. Mette, een officier van eenendertig, houdt het alleen vol met Hannes handen op haar buik. Twee stemmen vertellen de negende
    nacht, als het trillen stopt: Mette, die voor het eerst iets wil zonder dat het moet, en Hanne, wier man thuis zijn vonk in slaap zingt. Het
    leger hangt de diefstal aan een ander.'
