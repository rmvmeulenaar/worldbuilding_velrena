    blijft ze leeg door de kruiden die ze elke maand door haar wijn roert. Met Lenne, de gifmengster van de prins, deelt ze ''s middags het bed
    achter de tralies, en voor elke middag krijgt Lenne een bladzijde. Dan telt Merel de vroedvrouwen die ''s nachts komen: twaalf bevallingen,
    nul zonen in de annalen. De Zusters schrijven jongens in als dochters. Ze schrijft het op en naait het boek in de voering van haar mantel.'
