  premisse: Hoog in Hoogvrouwe mag het volk van Corran nog schrijven, en zijn zuster houdt het rantsoenboek bij. Wie in de warme schacht naast
    het lekkende krachtblok uit de landers bij elkaar slaapt, krijgt dubbel brood; zij kiest de mannen en vrouwen met de dikste huid en kijkt
    vanaf de ladder toe. De vrouwen braken, de mannen verliezen hun haar in plukken op het stro. In haar tweede kolom staan de doden, netjes,
    met hun uren bij het blok. Na twaalf winters worden er handen geboren die niet branden. Dan vindt Corran die tweede kolom en leest hem voor
    bij het vuur.
