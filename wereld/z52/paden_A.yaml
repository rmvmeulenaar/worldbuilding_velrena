  premisse: 'Sinds de raad het schrift verbood, is Marit Kolde het geheugen van de nederzetting, want bij de latrines van Sabe Mehr praat iedereen.
    Ze weet wie met wie in de rietkraag ligt, wie rantsoen onder zijn bed spaart en welk raadslid op de plank huilt. Die kennis ruilt ze: een
    kom bonen voor een naam, een nacht in haar hut voor een besluit dat nog niet is uitgesproken. Raadsleden komen bij haar horen wat ze vorige
    week zelf besloten. Als er twee haar tegelijk willen omkopen, laat ze ze opbieden tot de stank haar niets meer doet.'
