  premisse: 'Op voorstel van Hesta Kael beveelt de grondraad de terugdraaikuur: de holle botten van de verkenners moeten weer zwaar worden, want
    wie vliegt, kijkt ''s nachts op de nederzetting neer. De arts van de verkenners meet elk geraamte, noteert gewichten die niet bestaan en moet
    zich in vier zittingen verantwoorden. Daartussen ligt ze op de klif met Daan, een verkenner van vierendertig, en voelt zijn ribben kraken
    als ze hem te hard vasthoudt; hij bijt in haar schouder om niet te schreeuwen. Ze liegt elke zitting beter. De kuur komt er nooit, en het
    eerste nest heeft geen naam.'
