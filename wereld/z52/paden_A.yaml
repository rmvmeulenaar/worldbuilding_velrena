    zegel. Hij weet dat de inhoud na een middag dood is en dat de vonkdragers de bestelling nooit halen. Dus vult hij aan, elke ronde anders:
    rijstwater, eiwit, en wat hij en Fenke van de keuken op de graanzakken samen maken, lachend, de grendel erop. De generaals zegenen de kruiken,
    en de soldaten vechten precies even slecht als eerst. Alleen een kapitein die er drie tegelijk nam, komt terug zonder ogen, en Bas giet die
    week niets bij.'
