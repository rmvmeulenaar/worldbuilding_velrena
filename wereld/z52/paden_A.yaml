    Hij laat een visser van tweeëntwintig, met een vonk te zwak om te binden, naar zijn koningin Ysolt brengen. Ysolt zegt ja, want ze wil regentes
    worden. Hagar kijkt toe vanachter het wandkleed, en er komt rook uit zijn mond. Na drie nachten is Ysolt zwanger en weet de visser te veel.
    Hagar wil hem laten verdwijnen, maar zijn vonk slaat over, en de kamer waar hij het bevel geeft, brandt met hem erin.
