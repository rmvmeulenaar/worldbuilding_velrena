  premisse: 'Na de Haremwet van Ardemar III int Korvin aan de Zoutkust de kuisheidsboete: drie zilverstukken per onwettige nacht, te betalen na
    de Oogstnacht. De kroon is failliet, en binnen twee jaar brengt de boete meer op dan het zout. Korvin vervalst de aanslagen: hij zet ze op
    naam van verdronken vissers, int de helft bij de levenden en steekt een kwart in zijn laars. Op Oogstnacht ligt hij zelf met een zoutwerkster
    in de pannen, gepekeld tot de knieën, en beboet zichzelf twee keer. Saelith ziet de cijfers, verdubbelt het tarief en eist voortaan ook van
    de doden betaling.'
