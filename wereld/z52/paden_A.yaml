  premisse: 'In het jaar zonder brood verkocht Geesje Asboerin haar man aan een vonkleger voor twee zakken rogge; dat vertelt ze aan niemand.
    Nu weet ze waar onder een afgebrande hoeve een graankelder ligt. Ze verkoopt de plek aan de kwartiermeester van Orlas en aan een sergeant
    van Varnath, elk voor een andere week, en sleept zelf vooraf de helft weg. De kwartiermeester ruikt naar brood en neemt haar mee naar zijn
    tent, en ze gaat graag. Haar lijst telt zakken af: veertig, negentien, zeven. Thuis wachten drie monden. Dan staan de twee legers in dezelfde
    nacht in haar kelder.'
