- code: VP-0-1b065e75
  premisse: |-
    Op voorstel van Hesta Kael beveelt de grondraad de terugdraaikuur: de holle botten van de verkenners moeten weer zwaar worden, want wie vliegt, kijkt 's nachts op de nederzetting neer. De arts van de verkenners meet elk geraamte, noteert gewichten die niet bestaan en moet zich in vier zittingen verantwoorden. Tussendoor neukt ze op de klif met Daan, een verkenner van vierendertig. Ze berijdt hem zo hard dat zijn ribben kraken, en hij bijt in haar schouder om niet te schreeuwen als hij komt. Ze liegt elke zitting beter. De kuur komt er nooit, en het eerste nest krijgt geen naam.
- code: VP-0-1b840686
  premisse: |-
    Haar waarschuwing over kleine bevolkingen ligt in een logboek dat sinds het schriftverbod niemand meer opent. Dus gaat de genetica van de Ysa zelf het veen in en zet haar eigen buik in. De slapeloze kolonist en zijn dertig volgelingen trouwen alleen onderling. Zij biedt vers bloed voor een plaats aan het vuur, kiest drie mannen en laat ze haar om beurten neuken tot ze zwanger is. Haar dochter wordt gezond geboren. De zeven baby's die daarna in de groep komen, hebben grijze huid en vergroeide vingers. Zij weet waarom: de groep is te klein.
- code: VP-0-1d6af0ca
  premisse: |-
    Een Aelthir-kolonist wil lang leven zonder de stemming te vergeten, terwijl de machine van het schip haar eigen Muiterij al kwijt is. Hij is de enige die het nog weet, en hij kan niet van snelle mensen afblijven: hun haast, hun zweet, hoe snel ze klaarkomen. Elke keer dat hij met een van hen neukt, verliest hij weer een stukje van wat hij bewaart.
- code: VP-0-2d1ddb54
  premisse: |-
    De eerste Tharn-reuzin leert haar werkers een lied dat de dagen telt, en ze wil weten waarheen het telt: naar de noodstand die in de Wieg op een hand ligt te wachten. Zegt ze het hardop, dan zingen haar mensen voortaan rouw in plaats van werk.
- code: VP-0-58d5f6b6
  premisse: |-
    Hoog in Hoogvrouwe mag het volk van Corran nog schrijven, en zijn zuster houdt het rantsoenboek bij. Wie in de warme schacht naast het lekkende krachtblok uit de landers met elkaar naar bed gaat, krijgt dubbel brood; zij kiest de mannen en vrouwen met de dikste huid en kijkt toe. De vrouwen braken, de mannen verliezen hun haar in plukken op het stro. In haar tweede kolom staan de doden, netjes, met hun uren bij het blok. Na twaalf winters worden er kinderen geboren met handen die niet branden. Dan vindt Corran die tweede kolom en leest hem voor bij het vuur.
- code: VP-0-5d3f8e08
  premisse: |-
    Een Tharn-zwaarwerker wil blijven bouwen, maar zijn lijf groeit door terwijl het daar nooit voor bedoeld was, en de enige die het kon verklaren is een vrouw van wie alleen gebeden over zijn. Hij verzwijgt het en werkt langzaam door, zoals Tharn dat doen. Hij rouwt om de kinderen die hij niet krijgt.
- code: VP-0-5fbddea1
  premisse: |-
    Sinds de raad het schrift verbood, is Marit Kolde het geheugen van de nederzetting, want bij de latrines van Sabe Mehr praat iedereen. Ze weet wie wie neukt in de rietkraag, wie rantsoen onder zijn bed spaart en welk raadslid op de plank huilt. Die kennis ruilt ze. Een kom bonen levert een naam op; wie haar in haar hut likt tot ze komt, hoort een besluit dat nog niet is uitgesproken. Raadsleden komen bij haar horen wat ze vorige week zelf besloten. Willen er twee haar tegelijk omkopen, dan laat ze ze opbieden tot het genoeg is om de stank van de latrines te verdragen.
- code: VP-0-9ba83aaf
  premisse: |-
    De eerste vormwisselaar ontsnapt uit het lab met één gezicht, dat van een Maker, en wil het houden. Maar de vrouw van dat gezicht bestaat alleen nog in gebeden. Wie met haar gezicht rondloopt, wordt een heilige waar anderen geld aan verdienen.
- code: VP-0-a4968fae
  premisse: |-
    Een ingenieur uit Corrans ploeg leidt de verbannen bewakers de steppe op en wil dat het ene wapen van het schip nooit gevonden wordt. In de Wieg wacht een noodstand die zo'n wapen weer nodig kan maken. Ze kan het niemand toevertrouwen, ook niet de mannen in het kamp die om haar vechten, verliezen en haar allemaal willen neuken.
- code: VP-0-ae964893
  premisse: |-
    De sensortechnica van de Wieg probeerde haar sensor op zichzelf uit en wil weten wat hij in haar meet. De machine die het kan uitlezen is vergeten waarom ze gebouwd werd; zoekt ze verder, dan wordt haar eigen lichaam het eerste instrument van de raad.
- code: VP-1-05080223
  premisse: |-
    Onder de groeve van Hoogvrouwe loopt een ader Sterrensteen die alleen de Dhurn kennen, en Garra Steenvoeler laat haar uithakken door vijf mannen die niet meer naar boven gaan. Wie het steen te lang vasthoudt, krijgt steenkoorts: blaren in de handpalmen, dromen die doorpraten na het ontwaken. Garra betaalt met stof, en ze berijdt de mannen in de mijnbaden, waar de koorts hun huid zo heet maakt dat het water sist. Haar lijst begint met vijf namen. Elke maand streept ze er een door en metselt zijn gang dicht. De laatste naam is van de man van wie ze houdt.
- code: VP-1-42cb8622
  premisse: |-
    Merel, tweede vrouw van Ardemar III, kauwt munt tegen de verveling en houdt een dagboek bij van alles wat de harem verzwijgt. Zelf wordt ze niet zwanger, door de kruiden in haar wijn. Met Lenne, de gifmengster van de prins, ligt ze 's middags achter de tralies, haar gezicht tussen Lennes dijen tot die komt, en voor elke middag krijgt Lenne een bladzijde. Dan telt Merel de vroedvrouwen die 's nachts komen: twaalf bevallingen, nul zonen in de annalen. De Zusters schrijven jongens in als dochters. Ze schrijft het op en naait het boek in de voering van haar mantel.
- code: VP-1-45cd1606
  premisse: |-
    Na de Haremwet van Ardemar III int Korvin aan de Zoutkust de kuisheidsboete: drie zilverstukken voor elke keer seks buiten het huwelijk, te betalen na de Oogstnacht. De kroon is failliet, en binnen twee jaar brengt de boete meer op dan het zout. Korvin zet de aanslagen op naam van verdronken vissers, int de helft bij de levenden en steekt een kwart in zijn laars. Op Oogstnacht neukt hij zelf een zoutwerkster in de pannen, tot de knieën in de pekel, en beboet zichzelf twee keer. Saelith ziet de cijfers, verdubbelt het tarief en eist voortaan ook van de doden betaling.
- code: VP-1-4e16e912
  premisse: |-
    Hoofdzuster Oda wil een kroon die zonder de Zusters niet kan, en de geboorteregisters zijn haar gereedschap: een zoon die er niet in staat, erft niets. Met elke naam die ze schrapt, komt ze dichter bij het kind dat ze zelf ooit wegaf.
- code: VP-1-ba43dea5
  premisse: |-
    Een geurloze Ves-Lethi-spion wil ongezien blijven aan het hof van de eerste koning. Daar gaat de troon voortaan van vader op zoon en schrijven de Zusters elke geboorte op; wil hij zelf koning worden, dan moet iemand een vader voor hem verzinnen, en die iemand weet dan wat hij is.
- code: VP-1-cc1fefb0
  premisse: |-
    In de Zusterburcht van Ves-Anath snijdt Ildra Steenzuster haar duim open boven een splinter Sterrensteen, en die gloeit als ze aan Wenne denkt. Wenne, uit de keuken, laat zich ook snijden, uit nieuwsgierigheid, dan uit liefde. Ze neuken met het steen tussen hun buiken, wrijven hun kutten erlangs tot ze komen, en het licht schijnt door hun huid. Ildra beschrijft elke proef in brieven aan de oudste Zuster, die terugschrijft dat zulke lust zonde is en om meer bloed vraagt. Wenne wordt grauw, haar tandvlees wijkt, haar haar blijft in de kam. Op het kapittel leest de oudste de brieven voor als aanklacht.
- code: VP-10-1befe506
  premisse: |-
    Wij zijn de werksters van wat ooit een korf was, en Zirrah is de jongste van ons. Onze dar Zummel is de eerste die oud werd in plaats van te sterven na de paartijd, en nu is hij toch dood. Niemand weet hoe je een dar betreurt. Zirrah wil het Laatste Bed: we zalven hem, liggen een nacht om hem heen en troosten elkaar. We likken en vingeren elkaar, huilend, tot we klaarkomen. Bij de brandstapel ruikt de was naar hem. Voor het eerst voelen we ons een familie.
- code: VP-10-25031c03
  premisse: |-
    Faren wil trouwen met Zehra van de Putten en wil niets liever dan met haar in bed liggen. Haar familie eist de Geloftebrand, de vuurrite die alleen Ishvar mogen ondergaan, met een hoedster die stopt als het te veel wordt. Hij verzint een Ishvar-grootmoeder en leert de eden bij de zon uit zijn hoofd. Wat we lezen, is zijn toespraak voor de rite, in hun taal, foutloos. De hoedster stopt hem niet bij het vuur maar bij één woord: zo zweert alleen iemand van buiten.
- code: VP-10-29c378e3
  premisse: |-
    Bertram Lak maakt al veertig jaar lakken laarzen tot de dij voor de rijke vrouwen van Saelith. Als de laarzen van een oude Moeder van de Orde gestolen worden, bestellen twaalf vrouwen een kopie, elk met de belofte dat zij de enige is. Zijn kasboek groeit, regel na regel, tot de twaalf op het groetfeest naast elkaar staan en de mannen, met een harde pik in hun broek, niet weten wiens laarzen ze moeten kussen. De echte duiken op aan de benen van Bertrams eigen vrouw.
- code: VP-10-2ed6eed4
  premisse: |-
    Een Kluwer-werkster zonder korf verkoopt in Brakhaven wasnachten. Klanten neuken haar in warme was en komen klaar in de korfgeur, en haar kasboek wordt rijker dan dat van een huis. Uit de cijfers blijkt wat ze niemand vertelt: de was raakt op, en de families die de rechten op de laatste korf claimen, kopen haar klanten één voor één weg.
- code: VP-10-37dfc815
  premisse: |-
    Een Aelthir en een sterfelijke houtsnijder gaan samen in een feeënring liggen en laten het net hun herinneringen ruilen. Ze vertellen het in twee stemmen. Tussen zijn herinneringen vindt zij iets wat hij niet weet dat hij heeft gezien, en tussen de hare vindt hij wat Ileth ooit verkocht. Ze moeten kiezen wat ze aan de ander teruggeven.
- code: VP-10-47c3b969
  premisse: |-
    In een dorp van het Hoogvrouwe-gebergte vechten Ardis en de jonge Sanne met stokken op het dorsveld om wie smid Haldor mag neuken. Ardis verliest, zoals ze al verwachtte: haar knie, haar adem, de jaren in haar schouders. Ze kijkt toe, zoals de regel vraagt, en wordt zo nat van het kijken dat ze het niet kan verbergen. Tegen de ochtend gaat Haldor niet naar de winnares maar naar Ardis en likt haar tot ze komt. Sanne lacht, want ze vocht nooit om hem.
- code: VP-10-4bfa3275
  premisse: |-
    Grenna smokkelt in de groevenoorlog Orrim-kristalzaad door de linies, en de veiligste bergplaats is haar eigen kut. Haar minnaar duwt het zaad diep in haar terwijl hij haar vingert, en ze komt klaar als het erin zit. Ze weet dat het binnen negen dagen te groot wordt, en hij telt mee. Dag na dag gaat het langs posten en ingestorte gangen, met een nacht bij Hendrika Steenhut onder de Amberpas. Op de achtste dag bereikt ze de koper, en het zaad komt eruit als een steen die nog warm is van haar lichaam.
- code: VP-10-4fbf6c00
  premisse: |-
    Tomas is tweeëntwintig en wil op de tempeltrappen van Saelith de publieke Ontvangst doen: tempelhoedster Odalie neuken voor iedereen die kijkt, zoals op elk lentefeest sinds het zegellicht uit is. Halverwege, voor honderd getuigen, wordt zijn pik slap, en de menigte lacht. Ardis, een vrouw uit het Hoogvrouwe-gebergte, vertelt wat er daarna gebeurt: Odalie, op de laarzen van Bertram Lak, laat hem knielen en haar likken tot hij weer hard is, en laat hem dan opstaan. De menigte houdt op met lachen en begint te zingen.
- code: VP-10-53f07ba3
  premisse: |-
    In Hoornburg kan Ysmé nog van gezicht wisselen, want onder de burcht zoemt de kern van de Harrow. Weduwnaars uit heel Kharvos betalen haar om hen te berijden met het gezicht van hun dode vrouw, met haar geur, haar litteken en haar manier van kreunen als ze komt. Ysmé houdt een prijslijst bij en een vrouwe die haar beschermt. Als de vorstin de kern harder laat draaien, telt de burcht de uren af tot het zoemen stokt. Ysmé zit dan net op een klant, midden in een wissel. Ze blijft twee vrouwen tegelijk, met twee monden, en hij rent gillend de gang op.
- code: VP-10-5f72315a
  premisse: |-
    Veenke vlecht kooien van levende wortel in de veenhallen. In haar dagboek schrijft ze hoe Jelle haar daarin neukt, met haar rug tegen de warme spijlen, tot ze schreeuwt. De sleutel is een gezongen woord. Elke keer groeit de kooi een vinger dichter, en het net onthoudt wat erin gefluisterd wordt. Op een avond zingt ze het woord en de wortel blijft dicht. Ze zingt tot haar stem breekt, en Jelle zit binnen.
- code: VP-10-72fe7374
  premisse: |-
    In een ballade van de Amberpas: een Karrûk-vechtster wint het jaarlijkse gevecht, en in de tent erna ontdekt ze dat haar kampioen geen vonk meer heeft om te ontladen. Ze neuken toch tot de ochtend: zij berijdt hem, hij likt haar tot ze komt, zonder één vonk. Volgens het lied houden de clans daarna het gevecht en de tent, zonder de Storm die het ooit nodig maakte.
- code: VP-10-7d2022c1
  premisse: |-
    Hal is drie meter lang en heeft reuzenbloed, en aan het hof van een rijke huisvrouw staat hij op een lijst van gasten die door hem geneukt willen worden. Hij stemt toe, eerst uit nieuwsgierigheid, en ze willen allemaal weten hoe groot zijn pik is. De lijst wordt korter naarmate zijn botten blijven groeien: wie eerst geil op hem was, wordt bang voor hem. Aan het einde staat er niemand meer op, behalve de arts die zijn geraamte wil.
- code: VP-10-96c5b259
  premisse: |-
    Ottilie is vormmeesteres en scheidsrechter bij het vormspel: zij zegt hoe ver een lichaam tijdens het neuken mag zwellen of krimpen. Haar trouwste klant, Cas, wil elke maand een dikkere pik en verder gaan, en sinds kort een heel andere gestalte, die van de worm uit de oude verhalen. In één kamer, met Veenkes wortelkooi tegen de deur, weegt ze haar regels tegen zijn wens. Ze geeft hem een vorm die op de worm lijkt en het niet is, en vertelt hem nooit het verschil.
- code: VP-10-a36d1e26
  premisse: |-
    Na de nacht waarin de kern van Hoornburg bezweek, zitten de overlevende vrouwen van de burcht in de as om over Drystan te oordelen, gemaal van de vorstin. Hij had de sleutel van de kernzaal. Getuigen vertellen hoe de vorstin hem daar nacht na nacht bereed op de warme stenen, terwijl het zoemen door hun ruggen ging, en hoe hij de draaiing telkens hoger zette, op haar bevel en omdat hij het zelf wilde. Zijn verdediging is de waarheid: hij wist dat het zou breken. Dat maakt hem schuldiger. Ze sturen hem de woestijn in, met haar zegelring en zonder water.
- code: VP-10-ad865779
  premisse: |-
    Elk voorjaar houdt het Gilde van Vormmeesteressen in Brakhaven de Zwelkeur, en Ottilie zit de jury voor, want niemand meet zo eerlijk als zij. Het publiek komt voor zwellende pikken en kutten, maar het kweekvlees raakt op. In de eerste ronde rekt een paar zich nog een hand breed; in de derde vullen ze de maten aan met natte klei, terwijl de zaal joelt en ruikt naar rauw vlees en rozenolie. Ottilie verdient aan elke klomp klei, want zij liet hem aanmaken. In de laatste ronde valt er niets meer te meten, en het gilde reikt haar de erepenning voor eerlijkheid uit.
- code: VP-10-bb990e21
  premisse: |-
    Hendrika Steenhut is zestig, half Dhurn, en houdt de berghut onder de Amberpas. In een sneeuwstorm kloppen vier reizigers aan, en elk biedt volgens de groet een gift of seks; weigeren mag. Per ronde kiest Hendrika wat ze aanneemt: brood, een mes, seks met de stille marskramer, die haar likt tot ze klaarkomt. De vierde biedt niets en vraagt alleen een plaats bij het vuur. Bij de dooi blijkt dat hij uit Hoornburg komt en weet welke weg nog open is, en omdat zij niets van hem vroeg, vertelt hij het haar.
- code: VP-10-cce577ed
  premisse: |-
    Uit vrachtbrieven, een gestolen kaart en een getuigenis: hoe hoedster Ennika de laatste voorraad Orrim-stof uit een belegerde groeve smokkelt naar haar badhuis, waar de beeldnachten worden gehouden. De Orrim van wie de stof is, staan stil in de groeve en kunnen niet zeggen of ze het willen; Ennika vraagt het hun toch, en wacht.
- code: VP-10-d8c491b3
  premisse: |-
    Jij hebt wisselbloed: bij volle maan ben je twee nachten een man, en daarna weer jezelf. Je geliefde weet het en wil juist in die nachten door je geneukt worden, met de pik die je dan hebt; het dorp hoort een gehuil en zoekt een wolf. Als de jagers bij jullie deur staan, besluit je je niet te verstoppen, en dat verandert wat het dorp denkt dat een wolf is.
- code: VP-10-dbd26de5
  premisse: |-
    Ilse en Ravn zijn geil op elkaar en hebben één zweefhuid voor twee, de vleugelhuid van Ilses grootmoeder. Op het zomerfeest springen ze samen van de klifwand, zoals hun voorouders deden, om elkaar in de val te vangen. Het verhaal telt de seconden van die sprong af, en in die seconden ontdekken ze dat de huid hen maar half houdt en dat er maar één veilig kan landen.
- code: VP-10-ee733db3
  premisse: |-
    Grom, smid met een kwart Dhurn-bloed, verkoopt zingend ijzer op de jaarmarkt, ook al weet hij de toon niet. Hij slaat maar wat. In één middag, verteld zoals het gebeurt, komen drie klanten terug om te klagen en een vierde om te bedanken, want zijn verkeerde toon blijkt beter te werken dan de echte.
- code: VP-10-ee9fd6f3
  premisse: |-
    Je heet Liesje, je bent twintig en je werkt in een badhuis in Brakhaven waar ze Oevrin-slijm verkopen, het glijmiddel dat ook een roes geeft. Je laat je erin neuken door wie je kiest, glad tot aan je dijen, en na het klaarkomen weet je dingen die je nooit leerde: een lied, een getijde, de naam van een verdronken vrouw. Annelot Zoutvel, die er werkt sinds haar dienstjaren, zegt dat je moet ophouden met vragen. Je vraagt toch, en vindt van wie het slijm komt, maar je vertelt het niemand.
- code: VP-11-0e0aa0da
  premisse: |-
    De eerste admiraal in mensenheugenis die een man is, vordert het schip van Ressa Zoutvel en verwacht dat haar vrouwen salueren. Op het dek verzint Ressa ter plekke de zeemansdoop van de Sael-mor: uitgekleed, ingesmeerd met traan, in het want gehangen en door elke bemanningsvrouw op zijn pik beoordeeld. De admiraal wil niet onderdoen en zegt drie keer ja. Terwijl hij boven hangt te glimmen en de bemanning zingt, roeien twee matrozen de soldijkist van de vloot naar haar ruim. Hij noemt het later een eer, tot in zijn memoires.
- code: VP-11-43bd73de
  premisse: |-
    Als de dorpsmannen na negen jaar uit het koningsleger thuiskomen, kondigt herbergierster Aaltje Brons, weduwe, een Zevenvoudige Ontvangst aan zoals de liederen die beschrijven: zich door zeven mannen laten neuken, een voor een. Zeven veteranen schrijven zich in. Ronde na ronde, met water en olie ertussen en een snuif sporen omdat zaad niets meer doet, blijkt elke man iets anders te willen dan hij zei: praten, slapen, huilen, of de kok. Bij de zevende lacht het hele dorp mee, en Aaltje krijgt precies wat ze zocht.
- code: VP-11-47e6b935
  premisse: |-
    Een heelster op de Nevel-eilanden neemt met haar geliefde sporen en neukt dan uren door, harder en natter dan vroeger met de vonk. Van die nachten houdt ze een dagboek bij. Elke week staan er minder dingen in die ze zich herinnert. Op een dag leest ze haar eigen beschrijving van een vrouw die ze niet meer kent, en dat is zijzelf.
- code: VP-11-69d90386
  premisse: |-
    Wij, de bemanning van een kustschip, nemen een man van het land mee naar de springtijnacht ver uit de kust, want onze kapiteinsvrouw met havenbloed wil hem in het water berijden. Hij kan niet zwemmen zoals wij, en de nacht in het water wordt een strijd om hem levend door het tij te krijgen. Hij komt boven, en hij blijft.
- code: VP-11-6aaedb8b
  premisse: |-
    Joran heeft Myrrhen-bloed en in zijn longen groeien meer sporen dan een lichaam aankan; ademt niemand ze van hem in, dan krijgt hij koorts. Mareth, net los van een man die sporen als leiband gebruikte, belooft het één keer te doen, met haar mond op de zijne. Om beurten vertellen ze de maanden erna: hoe hard hij wordt als ze inademt, haar trillende handen als hij een dag weg is. Dan keert het. Zij leert hem zijn adem in te houden, en hij moet ontdekken dat hij zonder haar ook leeft.
- code: VP-11-873f951f
  premisse: |-
    Ylva trekt het rode lakpak van een gesneuvelde kapitein van de Wacht aan, gespt zijn leren tuig over haar borst en loopt de laatste kluis in, want die deur leest het pak en niet het gezicht. Haar geliefde, de weduwe van de kapitein, sluit de gespen in de volgorde die bij zijn rang hoorde en vingert haar onder het leer tot ze komt. Binnen één uur, minuut na minuut, gaat elke poort open, tot een wachter van vlees vraagt waarom ze niet naar hars ruikt. Dan komt uit wie de kapitein doodde.
- code: VP-11-8bfa1105
  premisse: |-
    Tamas, steenslijper aan de rand van de woestijn, vertelt hoe hij met zijn geliefde Ilke het stof opveegt dat de Orrim nog van elkaar slijpen. Ze roeren het door olie, wrijven elkaars pik en kut ermee in tot het schrijnt en neuken tot ze klaarkomen. Daarna liggen ze stil tot het afkoelt. Ze doen het naast een beeld dat 's nachts warm wordt. Tamas begint te vermoeden dat het kijkt en dat het stof van dat beeld komt. Ilke wil het niet weten, dus vraagt hij het niemand.
- code: VP-11-a12f8ff5
  premisse: |-
    De hofrol van een oase bij Qesh spreekt zelf. De laatste Zonvorst daar trouwt vrouwen met Dhurn-bloed, omdat hun handen nog een kluis openen, en zij vechten erom wie door hem geneukt wordt, met verleiding, roddel en soms gif. Neshra, Ishvar en zonder bijzonder bloed, schrijft de rol bij en weet wie wanneer zijn pik krijgt. Gaandeweg ziet ze dat hij geen kluis zoekt maar een erfgenaam, en dat hij er nooit een zal verwekken. Dat zet ze niet in de rol.
- code: VP-11-a727ba82
  premisse: |-
    Dertig mannen die uit het koningsleger zijn weggelopen, huurt Ylva Teerling in de herfst, met beloften die ze niet heeft: zilver uit een kluis in de bergen, en wie zij kiest, mag haar neuken onder haar deken. Ze kiest zorgvuldig, om de sterksten tegen elkaar op te zetten. Elke pas kost mannen: aan zwarte tenen, aan messen in ruzies over wie haar mag hebben, aan een lawine. Bij de kluisdeur zijn ze nog met negen, en de deur blijft dood. De negen draaien zich naar haar om. Ylva wijst omlaag, naar de kookvuren van een ander kamp, en ze volgen haar.
- code: VP-11-b1343bfc
  premisse: |-
    Brokke, smid met een Dhurn-grootvader, woont bij de poort waar een oude Tharn en een oude Dhurn al jaren kibbelen over wie de laatste is. Hij houdt van Gudrun, twee meter zeventig, met een Tharn-overgrootmoeder, die hem wil berijden maar bang is hem te breken. In één kamer, met de twee ruziemakers onder het raam, leren ze tellen: zijn adem, haar gewicht op zijn pik, drie klopjes op de vloer bij genoeg. Het lukt, ze komen allebei klaar, en buiten horen de oude mannen alles.
- code: VP-11-b41a1799
  premisse: |-
    Gudrun en Brokke laten zich verzegelen zoals de Dhurn het deden: het gilde sluit het paar op in een schacht, een hoedster waakt bij het luik. Midden in de rite, terwijl hij diep in haar zit, verliest de steen in de hal zijn laatste gloed en kraken de stutten. De hoedster telt hardop hoeveel tijd er rest. Gudrun zet haar rug onder de zoldering, Brokke slaat zoemend ijzer in de spleet, en de schacht waarin ze zich wilden binden, wordt de uitweg voor het hele gilde.
- code: VP-11-c68222ac
  premisse: |-
    Garreth en Wobbe, deserteurs uit hetzelfde koningsleger, schuilen voor de storm in een veenhal op de Nevel-eilanden, waar de bewoners hun brood delen en niet slapen. We volgen één nacht, uur na uur. Om warm en wakker te blijven pijpen de twee mannen elkaar onder één vacht bij het vuur en trekken elkaar af, terwijl in het donker ogen openblijven. Tegen middernacht ruikt Garreth zoete rot onder de huid van hun gastvrouw. Daarna valt Wobbe in slaap. Bij het eerste licht staat hij op met de anderen en kent Garreth niet meer.
- code: VP-11-e36d02b6
  premisse: |-
    Wessel giet al dertig jaar kaarsen in een dorp aan de mistrand. Neveth, een Aelthir, vraagt hem heet vet op haar huid te druppelen, ook op haar tepels en haar kut, omdat ze alleen nog door hitte kan komen. Elke keer neemt de was een afdruk van haar rug, en hij zet die op een plank. Daarnaast houdt hij bij wat ze nog voelt: wol, adem, zijn duim. Dat lijstje wordt korter. Op een ochtend kijkt ze naar de afdrukken en vraagt ze hem wie hij is.
- code: VP-11-e85b1498
  premisse: |-
    Jij ademt al drie jaar elke volle maan de sporen van Hesse in, en daarna ben je twee dagen geil, zoals vrouwen vroeger naar een gaven-man. Hesse weet dat. Wie hem gehoorzaamt, krijgt sporen; wie vragen stelt, wacht. Zo regeert hij het eiland vanuit zijn keuken. Op jouw verzoek binden je vriendinnen je met zachte linten in de binnenhof, en ze likken en vingeren je tot de tweede zonsopgang. In die nacht merk je eindelijk wat hij door de sporen mengt.
- code: VP-11-e9bfc953
  premisse: |-
    Het kasboek van Ressa Zoutvel, kapiteinsvrouw op een van de laatste schepen met Sael-mor-bemanning. Wie zonder munt weg wil van de terugkerende legers, mag kiezen: werken op het dek, of de overtocht betalen door met de bemanning te neuken. Elke keer staat erin met naam en haven, en Ressa en haar matrozen worden er rijk van. Maar in elke haven blijven er matrozen achter, getrouwd aan land. Op de laatste bladzijde staan meer passagiers dan bemanning, en het schip hoort niet meer bij haar volk.
- code: VP-11-f40f034c
  premisse: |-
    In brieven aan haar zuster in Kaldrun beschrijft gezante Brenna de puinstad onder het gevallen Hoornburg, waar mannen nog heersen uit gewoonte en waar zij opeens bezit heet. Ze wordt verliefd op Edrik, een schrijver van de vorst die om haar sjerp lacht, en ze wil hem berijden tot hij niet meer lacht. Wanneer een hofdame hem opeist, daagt Brenna haar uit tot een duel naar Kaldra-gebruik, tot opgave. Edrik mag weigeren. Hij zegt ja, en het hof weet niet meer wie van wie is.
- code: VP-11-f7ffc9e0
  premisse: |-
    Een contract voor zeven dagen, een bladzijde uit het register van een speelhuis in Brakhaven, een brief die nooit vertrok. Corvin speelt al twintig jaar de gaven-man in de Overdracht, met sporen waar vroeger vonk was. Saskia, dertig, geeft hem haar sjerp en haar naam, draagt zijn gegraveerde halsband en laat zich elke avond op haar knieën door hem neuken; het woord Ysa-rust geldt elk uur. Op de vijfde dag betrapt hij haar in het archief, zoekend naar een moeder die daar ooit verdween. Hij laat haar zoeken en noteert niets.
- code: VP-11-fd55cb00
  premisse: |-
    Neshra van de Putten weet als enige aan het hof van Qesh dat de Zonvorst geen erfgenaam kan verwekken. Ze haalt in het geheim een smid met Dhurn-handen uit de bergen, die met instemming van de eerste vrouw bij haar een kind moet verwekken. Eerst test Neshra hem zelf: ze laat zich door hem neuken achter de luiken van de schrijfkamer en let op hoe hij vraagt, hoe hij naar kolen ruikt en hoe hij haar met zijn handen laat komen. Zeven nachten. De achtste weigert hij de eerste vrouw; hij wil Neshra. De Zonvorst vindt hen samen, en het hof weet binnen een dag waarom er nooit een erfgenaam kwam.
- code: VP-12-18eb31e9
  premisse: |-
    Imke Deral ontdekt de verstekeling eerder dan wie ook: een Ves-Lethi met nog één wisseling in zich, die zich als Aelthir aan boord wil smokkelen. Ze verraadt hem niet. Pas daarna vraagt ze, wetend dat hij nee mag zeggen, of hij haar één keer wil neuken met het gezicht van haar man, die twintig jaar geleden verdronk. Hij stemt toe en weet wat het kost. Tot de ochtend, in één kamer, zegt zij wat ze haar man nooit zei. Wie er daarna aan boord gaat, vertelt ze aan niemand.
- code: VP-12-1e4d0ca7
  premisse: |-
    Als de dode Leegteworm aanspoelt, koopt Gesine Traan van de strandvoogd het recht zijn ruim uit te koken. Haar kasboek telt vaten traan, en later iets anders: de klieren in de wand druipen een warm slijm dat wie het op de huid krijgt dagenlang geil en koortsig maakt. Ze verkoopt het per kruik aan de havenhuizen, de strandvoogd voorop. 's Nachts komt het dorp zelf in het ruim om er in groepen te neuken, glad van het slijm, in de stank. In de derde maand groeien bij de vaste klanten blaren met kleine tanden. Gesine noteert de namen, verkoopt door en koopt ten slotte zelf.
- code: VP-12-44c54a39
  premisse: |-
    Hedde, heelster aan de veenrand, gaat met Orl, een Myrrhen die weigert met de lander mee te gaan, in het rotbed liggen: een week lang groeit schimmeldraad tussen hun lijven, en een hoedster mag hem elk moment doorknippen. Zijn pik blijft in haar terwijl de draad hen aan elkaar vastgroeit, en ze komt keer op keer, met jeuk en warmte overal. Op de vijfde dag zwijgt de stem in de Wortel en rilt het hele net. Het geeft haar iets door, en Hedde besluit het in haar huid te bewaren.
- code: VP-12-46230b3d
  premisse: |-
    Een dode Leegteworm spoelt aan bij de slikpoelen, en zijn rottende ruim vergiftigt het water van de Oevrin. Hedde biedt aan hun kuit te dragen naar een schone poel, drie dagen landinwaarts, in haar eigen lichaam; is ze er niet voor de derde avond, dan lossen de eieren in haar op. Haar dagboek houdt bij hoe zwaar het weegt, hoe de Oevrin-zanger naast haar loopt en de kuit stilzingt, en hoe ze 's nachts zo geil wordt dat ze zich vingert tot ze komt. Bij de poel blijkt dat de worm niet vanzelf aanspoelde.
- code: VP-12-4c748745
  premisse: |-
    Op de lijst van wie met de lander mee mag, staan eerst tweehonderd namen, dan honderd, dan veertig. Lisanne Vorst staat er niet op en wil erop. Buiten de rij om wil ze de lijsthouder pijpen tot hij haar naam opschrijft, een Aelthir die nog net aanraking voelt, en ze is niet de enige: elke vrouw in de rij heeft dat plan, en ze haten elkaar erom. Met elke naam die afvalt, weet Lisanne meer van hem. Haar eigen naam komt er nooit bij.
- code: VP-12-8da65397
  premisse: |-
    Zuster Aldra woont in het laatste huis van de Stille Zusters, dat de mannen afzwoer toen er nog een Orde was. Teyra, een Aelthir-priesteres, komt haar overhalen mee te gaan met de lander; Aldra wil haar juist overhalen te blijven. Ze vertellen het om beurten. Ze ruziën, en tussen de argumenten door likken ze elkaar tot ze komen; voor elk van beiden is dat ketterij. Na drie nachten wedt het hele zusterhuis mee. Teyra blijft, en Aldra leert haar voortaan elke ochtend opnieuw haar naam.
- code: VP-12-a7408d96
  premisse: |-
    Omdat hij als enige niet mee wil, laat de raad van de volken Okke Lindewei kiezen wie de laatste veertig plaatsen in de lander krijgen. Twee stemmen vertellen die week: Okke, en Merit, een touwslagersweduwe die hem als eerste seks aanbiedt en voorspelt dat iedereen volgt. Hij gaat in op wat hem wordt aangeboden, en het verhaal kijkt weg van het bed naar zijn gezicht: het is uitbuiting, gelabeld donker thema, nooit verleidelijk verteld, en het kost hem wie hij was. Op de laatste ochtend leest hij de lijst voor: alleen wie hem niets aanbood. Merit spuugt hem in het gezicht, en hij blijft achter.
- code: VP-12-a819b96a
  premisse: |-
    Een buurvrouw vertelt wat ze zag. Wijnanda, die aan de rand van de Groenmuil woont, schept water uit een verlaten kweekpoel, omdat datzelfde water in de oude vormhuizen vrouwen melk gaf zonder kind. Haar man en zij willen het spel uit de liederen. Het werkt: ze geeft melk die zoet is en tintelt, hij zuigt haar tepels leeg terwijl hij haar neukt, en ze komen er allebei hard van klaar. Dan houdt het niet op, het wordt elke week meer, en wat ze afkolft, groeit in de emmer verder.
- code: VP-12-bfbef664
  premisse: |-
    Dertig seizoenen diende Okke bij Sylwen, een Aelthir, onder een contract dat hem alles toestond behalve beslissen. Morgen vertrekt ze met de lander, en naar oud gebruik wordt zijn halsband doorgeknipt en omgedaan door een nieuwe eigenares, de mensenvrouw Femke, nadat hij nog één keer heeft geneukt met wie hij zelf kiest. De toespraak bij het knippen schreef hij voor Sylwen. Halverwege praat hij tegen Femke, en vraagt hij of hij deze keer zelf mag kiezen wie de band sluit.
- code: VP-12-c70af14a
  premisse: |-
    De nacht voor de start sluipt Lisanne, die geen plaats kreeg, met haar minnaar Daan de lander in. In een kast hangen uniformen van de Makers. Ze trekken ze aan en neuken zoals de oude reliefs het tonen: zij als kapitein boven op hem, hij als bemanning onder haar, op een plek waar niemand mag komen. Eén knoop aan haar jas blijkt echt, en het schip begint te tellen. Vierhonderd tellen later vinden ze de knop die het stopt. De navigator heeft het gezien en biedt Lisanne een plaats. Ze weigert.
- code: VP-12-d2579bc9
  premisse: |-
    In het havenhuis van Imke Deral hangt een vergulde kooi, en daarin woont al twee jaar Joep, die de sleutel om zijn hals draagt en elke avond kiest om binnen te blijven. Voor de gasten is hij haar trots, op fluweel; 's nachts likt hij haar door de tralies tot ze komt. Uit zijn brieven, die een dienstmeid onderschept, blijkt dat hij de Raad van de Laatsten vertelt welke van haar schepen de Aelthir naar de kust zullen varen. Imke leest ze allemaal, zegt niets, en zet de kooi open.
- code: VP-13-167a250b
  premisse: |-
    Aru en Taavo vertellen om beurten de vuurnacht waarin twee clans van het plat een verbond wilden sluiten met haar ja als onderpand. Taavo's vader, hoofdman van de Elandclan, biedt drie sleden barnsteen als Aru zijn zoon kiest, en haar eigen clan heeft dat barnsteen nodig voor de zomerruil. Ze krijgt de hele dag giften: olie, vet, een benen mes. Bij het vuur vraagt ze drie anderen, een voor een, en neukt met hen in het donker, zo luid dat iedereen het hoort. Taavo trekt zijn mes. Zijn stem stopt daar; die van Aru draagt een vete van drie geslachten.
- code: VP-13-3a2646cc
  premisse: |-
    Een weduwe neukt met haar nieuwe geliefde op een lage dosis sporen, de sporenspiegel, en ziet dan haar oude man in hem als ze klaarkomt. Na elke keer schildert ze zichzelf. Op de portretten weet ze steeds minder met wie ze eigenlijk slaapt. Ze moet beslissen of ze het laatste portret schildert of verbrandt.
- code: VP-13-46081174
  premisse: |-
    Wij trekken langs het riet van de drooggevallen zee, en Kerra is onze hoedster. Wie wil, laat zich in de vuurnacht door een gekozen geliefde met de rietzweep slaan of een lijn in de schouder snijden, en wordt er nat of hard van, terwijl Kerra hardop telt en stopt bij genoeg. Dit jaar komt er een stormwinter zonder wild, en de rite wordt het enige dat ons warm houdt. Als een man van twintig om meer vraagt dan hij kan dragen, stopt Kerra het, en een deel van ons trekt verder zonder haar.
- code: VP-13-4b13866f
  premisse: |-
    In de hongerwinter na de landbrug ligt het laatste vlees van het kamp onder de sneeuw achter de tent van Joost Lemmerik, en hij telt de dagen tot de rendieren terugkomen: veertig, dertig, twaalf. Wie wil eten, gaat 's nachts met hem naar bed, vrouw of man, en krijgt daarvoor een reep. Hij walgt van zichzelf en weigert niemand. Op de negende dag proeft hij dat de repen die hij uitdeelt niet meer van rendier zijn. Iemand vult zijn voorraad aan. Hij vraagt niet wie, en eet mee.
- code: VP-13-4d1f0fc6
  premisse: |-
    Voor twee families bij de landbrug uiteengaan, sluiten ze een zaadcontract op een gelooide huid: Ebbe van de Rendals neukt een vrouw van de oostweg tot ze zwanger is, en zijn familie krijgt daarvoor twee sleden en een tent. Hij bezegelt het door op de huid klaar te komen, zoals het altijd ging. De huid wordt hun kasboek, elke ruil erin gekerfd. Als het kind geboren is, blijkt dat de oostweg met nog een man een huid tekende, en wie de vader is, staat nergens.
- code: VP-13-5918baab
  premisse: |-
    Je loopt in de vuurnacht weg van het vuur, met Siem, die het even graag wil, naar de kring paddenstoelen waar volgens je grootmoeder de doden dansen en waar niemand mag liggen. Jullie neuken er toch, jij boven op hem. Het net groeit om jullie heen, een draad van jouw pols naar de zijne, en je komt zo hard dat je niet ziet dat er anderen in de kring liggen die niet ademen. 's Ochtends krijg je de draad niet los, en Siem spreekt met de stem van een vreemde.
- code: VP-13-62c8d5aa
  premisse: |-
    Bort Nooitgenoeg heeft als enige in het dorp zijn gerst niet verkocht, en in de hongerwinter is zijn kuil vol. Niemand kan betalen behalve met seks, dus kloppen ze aan, een voor een, op die ene lange avond die we volgen: weduwe Tamme met een kruik vet, de gebroeders Hark samen, de vroedvrouw die al twintig jaar zegt dat hij stinkt. Bort, die nooit iemand durfde te vragen, weet niet waar hij kijken moet. Hij geeft gerst voor een praatje, voor een hand op zijn knie, voor een pijpbeurt, en tegen de ochtend voor niets. De kuil is half leeg, en zijn bed ligt vol mensen.
- code: VP-13-6ecb921c
  premisse: |-
    Twee zomers na de kring kiest Noor bij het vuur zeven mensen die haar mogen neuken, een voor een, met water en vet tussen elke keuze, zoals een half vergeten lied het voorschrijft. De kampen raden waarom. De een zegt dat ze een vader zoekt, de ander dat ze een weddenschap won, een derde dat de doden haar sturen. Per ronde slaat het gerucht een andere kant op. Bij de zevende blijkt het eenvoudig: ze wilde weten of ze zonder draad nog kon klaarkomen. Dat kan ze, zeven keer.
- code: VP-13-99512f8a
  premisse: |-
    Bij het vuur van de kortste nacht dagen twee vrouwen elkaar uit om Ebbe, met een sjerp over de schouder, tot een van beiden opgeeft. Hij mag weigeren, en het kamp kijkt hoe hij nadenkt. Hij zegt nee. Ze vechten toch, nu om de eer, in modder en roet, en het gevecht duurt zo lang dat het vuur zakt. Aan het eind liggen de twee hijgend naast elkaar in het gras en likken ze elkaar tot ze allebei komen. Ebbe houdt de wacht bij het vuur.
- code: VP-13-9e0b9342
  premisse: |-
    Ilsabet schrijft haar geliefde Wenke over wat ze samen deden in de kring paddenstoelen: schimmelolie, langzaam tellen, haar hele hand in Wenkes kut, tot Wenke kwam en ze elkaars adem meetelden. Ze schrijft ook wat ze diep in Wenke voelde: iets hards en kleins, als een zaadje van metaal, dat warm werd onder haar vingers. Wenke schrijft terug dat haar grootmoeder er ook zo een had. Geen van beiden wil weten wat het is, en ze vertellen het aan niemand anders.
- code: VP-13-c408cb2c
  premisse: |-
    Drie grootmoeders, naar een gebruik dat niemand meer kan uitleggen, oordelen over Kerra nadat een man bij haar snijrite te veel bloed verloor. Ze mag kiezen tussen verbanning en een dag op het schandpodium: in grijs, met een halsband, terwijl de kampen kijken en spreken, en bij zonsondergang een zalving. Ze kiest het podium. In haar toespraak bij het vallen van de avond zegt ze wat ze die dag hoorde, en wie de man het mes gaf dat te scherp was.
- code: VP-13-cef67736
  premisse: |-
    Een lied van het plat: Aru is twintig en staat voor het eerst bij het vuur van de kortste nacht, waar wie wil een of meer mensen kiest om mee te neuken. Ze kijkt alleen, de hele nacht, nat van het kijken, en wordt drie keer gevraagd. Pas tegen de ochtend vraagt ze zelf, en het lied eindigt bij het antwoord.
- code: VP-13-d4bb30a3
  premisse: |-
    Joost draagt over de landbrug het tuig van de trekleider die in de eerste sneeuw stierf: leer en hars, met gespen waarvan elke stand iets betekende. Niemand weet dat hij die standen niet kent; hij doet alsof, en het kamp volgt hem. 's Nachts gespt Rinske, zijn vrouw, hem erin vast, berijdt hem en leert hem zo wat elke gesp doet. Hij houdt er schaafplekken aan over en zweet, want het kamp rekent op hem. Hij brengt ze over.
