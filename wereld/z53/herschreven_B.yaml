- code: VP-13-de6da01d
  premisse: "Je bent Rokko, eenentwintig, en voor het eerst mag je mee op de jacht op de wolreus die in de dooi door het dal trekt. Je ligt een dag in de modder naast Inga, de speervrouw die je niet ziet staan, tot de grond trilt. Het beest vertrapt twee man en scheurt je dij open. Inga's speer zit erin, de jouwe ook. Bij het vuur smeren jullie elkaar in met zijn warme bloed, en voor de hele kring vraagt ze of je met haar naar bed gaat. Je zegt ja, met koorts en een dij die met pees is dichtgenaaid. Het dorp eet wekenlang."
- code: VP-13-f79b9ca5
  premisse: "Bij het oogstspel biedt de zuinigste boer van het dorp zichzelf gemaskerd aan, omdat hij denkt dat niemand zal bieden en hij dan het feest gratis krijgt. Ronde na ronde gaat het bod omhoog. Aan het eind heeft het dorp een nieuw dak, en hij heeft seks waar hij zelf nooit om had durven vragen."
- code: VP-14-20b28f5f
  premisse: "Een vrouw staat bij laag tij in de zangpoel met een Oevrin-man die ze nooit zal aanraken. Ze vertelt hoe de zang door haar huid gaat en hoe het water elke maand hoger staat. Op de laatste avond dat de poel nog bestaat, zingen ze door tot het tij hem overspoelt. Daarna is de poel weg."
- code: VP-14-239403c0
  premisse: "Oelwyn kan niet meer zingen sinds de stormnacht, en haar volk trekt de diepte in nu de poelen verzilten. Wessel kan niet mee. In twee stemmen vertellen ze de tweegelofte die ze sluiten op het laatste droge stuk slik: een lok van zijn haar tegen een schub van haar kieuw, samen baden, één keer langzaam met z'n tweeën naar bed, en dan haar belofte dat ze terugkeert. Ze gaat. Elk voorjaar bij het laagste tij staat ze weer in de branding, ouder, en ze zegt niets."
- code: VP-14-2d96e1f4
  premisse: "Brom verhuurt de achterkamer van zijn badhuis aan stelletjes uit het binnenland die komen voor de stank van verdronken slik: rottend wier, zwart slijm, een geur waar ze kokhalzend opgewonden van raken. Het loopt goed, tot een echtpaar van kenners ruikt dat hij het slik aanlengt met vers zand, omdat hij er zelf misselijk van wordt. Om zijn naam te redden moet hij één avond zelf de kuip in en met hen allebei seks hebben. Het blijkt hem te bevallen."
- code: VP-14-34f111ff
  premisse: "Jij laat je ontvoeren door je eigen minnaar, Kelm, een man met spleten in zijn hals, om je rijke echtgenoot losgeld af te troggelen voordat de haven verdrinkt. In het ruim knevelt Kelm je met de laatste rol zoutzijde; drie keer knipperen is stop, en dat spel hebben jullie samen afgesproken. Dan verkoopt de bemanning de afspraak door, en vanaf dat moment is het een gelabeld donker thema: echte gijzeling tussen volwassenen. Je komt vrij met het geld. Niemand komt te weten wie de knevel vastbond."
- code: VP-14-4011aa49
  premisse: "In een paalhuis in de verdrinkende delta koopt Saphra Duinlezer voor één seizoen Ennor, een rietsnijder die zichzelf verkoopt om zijn moeder in het droge dal te krijgen. Het contract hangt op een plank boven het bed: drie keer per week seks, met zijn ja elke keer opnieuw, zijn sjerp aan de spijker. Buiten het contract om gaan ze samen in die kamer wonen, terwijl het water elke maand een tree hoger aan de deur staat. Zij scheurt het contract als eerste. Hij gaat toch terug de delta in, naar zijn verdronken dorp."
- code: VP-14-668c8f70
  premisse: "Twee wierden, één stijgende zee: wie vannacht de dijk van de ander doorsteekt, houdt zelf droge voeten. Hidde, de sterkste spitter van Oosterwierde, ligt sinds de schemering met Aukje, dijkgravin van de overkant, in het hooi op haar zolder, en ze weten allebei waarom: elk wil horen waar de ander gaat graven. Tot het tij keert hebben ze seks en liegen ze tegen elkaar, om en om. Om twee uur rent hij met een schop door het slik. Hij steekt niets door. Hij dicht het gat dat haar mannen al groeven, en zij kijkt toe."
- code: VP-14-7d5b591c
  premisse: "Toen Teun stierf, de laatste van een lijn van wie men zei dat zijn handen vrouwen sterker maakten, brachten zijn vroegere minnaressen hun gouden oorringen naar Aaltje om te smelten tot een beeld voor de tempel die de zee binnenkort neemt. De laatste nacht slaapt ze met Rinske, zijn andere weduwe, in zijn lege bed. In haar rede bij de stoet weigert ze te smelten: ze geeft elke vrouw haar ring terug, en de tempel verdrinkt leeg."
- code: VP-14-9806c302
  premisse: "Oelwyn heeft een keelzak die rekt als een net, en haar minnaar Wessel, dijkwerker op de laatste wierde, laat zich er graag half in opnemen terwijl zij zijn adem telt. Dat was hun seksspel, altijd met zijn hand op haar kieuw als teken. In de stormnacht dat de dijk breekt, moet ze hem onder water meenemen en uren voor hem ademen, minuut na minuut verteld. Hij leeft. Haar zak scheurt, en in de zangpoel blijft ze voortaan stom."
- code: VP-14-9e55fc16
  premisse: "Zoals in de oude liederen wil Gesche seks met zeven mannen achter elkaar, om vol kracht te raken, en heelster Imme van de veenhallen kent de rite nog. Zeven mannen die ja zeggen, zeven rondes, en tussen elke ronde brengt Imme met haar hand het zaad diep, terwijl de sporen in de lucht het laten voelen als vonk. Een nuchtere zuster waakt. Na de vijfde ronde lacht Gesche om niets; na de zevende weet ze haar eigen naam niet meer, en Imme kan het niet terugdraaien."
- code: VP-14-aec99257
  premisse: "Wij van de zonne-eed nemen de mensen uit de verdronken delta op in ons droge dal, en om hun land te betalen houden we het oogstspel: mannen die willen, bieden zich gemaskerd aan voor één nacht seks, en de opbrengst is voor de vluchtelingen. Saphra roept de biedingen af, scherp en vrolijk. Pas na drie oogsten zien wij dat de beste mannen steeds naar dezelfde gemaskerde koopster gaan, en dat zij met onze schaal betaalt."
- code: VP-14-fb5797b8
  premisse: "Een lied uit het binnenland gaat over de laatste vuurnacht op het plein van een stad die al half onder water stond. Het vuur brandde op een vlot, het tij liep tot de knieën, en badmeester Brom eiste dat iedereen eerst gewassen werd, zoals zijn grootmoeder het deed: zout water, stilte, zeep. Daarna koos wie wilde iemand om mee te vrijen, voor de ogen van het hele plein. Brom keek, telde en waste. Volgens het lied kwam de zee pas toen hij klaar was."
- code: VP-15-29c422d4
  premisse: "Neskes zus vertelt de dorpsraad wat er gebeurde toen Neskes man na zeven jaar van zee terugkwam. In hun oude spel slaat hij haar met de vlakke hand tot de huid rood is, en de afdruk staat verkeerd: deze man is linkshandig. Neske stopt, steekt de lamp aan en hoort de waarheid; het is zijn broer, die hem zag verdrinken. Pas weken later gaat ze met hem naar bed, met open ogen, en de raad weet niet of dat mag."
- code: VP-15-31c3e94d
  premisse: "Je komt in een huidboot aan van een kust waar je dacht dat alleen jouw volk woonde. Bij de grenssteen zalft een vrouw iedere reiziger en vraagt waar hij heen gaat, en jij weet geen antwoord. Ze zalft je toch en gaat met je naar bed. In het donker telt ze op haar vingers met drie woorden die jouw moeder gebruikte om te tellen. Je vertrekt voor het licht zonder iets te zeggen, dus thuis hoort niemand dat er aan die kust nog een volk woont."
- code: VP-15-53adb3b6
  premisse: "Hellik en Mos, wiens moeders nog in het veen woonden, gaan in een kring van paddenstoelen liggen en laten de zwamdraad tussen hun buiken en handen groeien. Vijf dagen zitten ze aan elkaar vast in één hut, voeden elkaar en voelen elkaars hartslag in hun eigen vel. Op de zesde dag snijdt Hellik de draad door, en Mos weet niet meer wie Hellik is. Wat Mos van Hellik wist, is met de draad in de grond achtergebleven."
- code: VP-15-5ad31ee5
  premisse: "Oroth en Djeda vertellen het om beurten: hoe ze voor het eerst seks hadden in de graanschuur van Oroths rivaal, tussen zakken gerst die naar muizen en zweet roken. Djeda is getrouwd met de dochter van die rivaal, Oroth is hoofdman bij de eed, en een hoofdman knielt niet. Djeda laat hem knielen. Om het te kunnen blijven doen, bedenken ze samen een feestdag waarop wie beveelt gehoorzaamt, zodat het hele dorp één dag omkeert. Djeda's vrouw raadt het. Ze zwijgt, in ruil voor de helft van Oroths akkers, en de omkering wordt een gebruik."
- code: VP-15-6784f44c
  premisse: "We hebben de eerste gerst binnen op de nieuwe kust, en dus gaat de graanschuur een week open voor wie er seks wil hebben. Elke avond trekken we kiezels uit een pot om te bepalen wie naar binnen mag, en wie gaat, moet het de ander drie keer vragen. Hellik, die nog nooit iemand iets durfde te vragen, trekt zes avonden achter elkaar de witte kiezel. Wij lachen, hij stamelt, en op de zevende avond vraagt de molenaarster of hij met haar naar bed gaat."
- code: VP-15-939405ff
  premisse: "Siwa wil seks met Rafe buiten de beurt van het vuur, en daarom laat ze zich met zeegrastouw vastbinden aan de grijze steen bij de branding. Tot de ochtend raken de vrouwen van het dorp haar aan en zalven haar, en niemand laat haar klaarkomen. Bij dageraad mag Rafe kiezen. Ze heeft het hem maar twee keer gevraagd en niet de derde keer, en dus laat hij haar gaan."
- code: VP-15-9647b8d0
  premisse: "Garron noemt zich zoon van de donderaar en heerst over drie baaien met sporennachten: in zijn hal ademen vrouwen de zwam in en gehoorzamen hem tot de ochtend. Siwa, nu negenentwintig, ademt dezelfde sporen in en voelt acht uur lang een kracht die haar grootmoeder alleen uit liederen kende. Hun twee stemmen vertellen hoe ze hem in zijn eigen hal vastzet, met zijn instemming en tot zijn schrik, en hoe hij merkt dat zij het bevel heeft."
- code: VP-15-a622a438
  premisse: "Ama zingt bij elke geboorte drie woorden van haar vader, en zij maakte van die woorden de godin van de wieg. Op haar vijftigste maken de jonge vrouwen haar grijze sjerp zilver en zalven haar, en een man van dertig vraagt haar drie keer of hij met haar naar bed mag. Bij de derde keer zegt ze ja. In bed spreekt hij de woorden anders uit dan zij ze kent: hij leerde ze aan een andere kust. Ze zingt ze daarna toch zoals altijd."
- code: VP-15-dda6c4c3
  premisse: "Het dorp aan de baai ontvangt Tor met de reizigersgroet: olie op zijn voorhoofd en drie vrouwen die het hem elk drie keer vragen en dan met hem naar bed gaan. Hij zegt ja, elke ronde. In de vierde ziet hij dat het hele dorp dezelfde neus heeft en de jonge mannen scheel kijken. Ze willen vreemd bloed. Als hij weg wil, is zijn huidboot verbrand; vanaf dan is hij gevangen, gelabeld donker thema, en niemand raakt hem aan. In de vijfde ronde graaft hij zich onder de palen door. Op zee begrijpt hij dat een van de drie al zwanger van hem is."
- code: VP-16-058370db
  premisse: "Een kroniekschrijver vertelt over de kermis van 1424, waar het dorp gemaskerde mannen veilde voor een nacht seks, om de nieuwe klok te betalen. Joos, stroper, met de baljuw op zijn hielen, biedt zich gemaskerd aan, omdat de koopster hem in haar wagen mee de stad uit zal nemen. Het bod gaat hoog. De seks is goed, en hij doet zijn uiterste best. Bij het licht doet zij haar masker af: de vrouw van de baljuw, die haar man de volgende ochtend inlicht."
- code: VP-16-30fead41
  premisse: "Bij nieuwjaar wassen priesteressen de bruidegom van de stadsgodin, en dan heeft hij seks met de hogepriesteres op het plein, voor duizend ogen. Als de man van de koning ziek wordt, kiezen zij Kiddu, omdat zijn gelakte huid glanst in het fakkellicht, en de priesteres vraagt hem eerst, zoals het hoort. Hij zegt ja. Pas op het plein hoort hij dat de koning de bruidegom daarna wil laten verdwijnen. De ballade vertelt hoe hij wegrende en alles achterliet."
- code: VP-16-33f97367
  premisse: "Lijsbet is achtenvijftig en woont in Hulst, ver van het land dat de zee nam, en in haar huis sluiten twee vrouwen de tweegelofte: Grietje, weduwe, en Marij, die de bakkerij runt. Een lok haar, een ring, samen in het bad, en één keer met z'n tweeën naar bed in de opkamer. Lijsbet houdt de rede. Ze zegt daarin hardop wat ze nooit eerder zei: dat liefde langzaam kan gaan, en dat ze op stille avonden de klokken van Saeftinghe hoort."
- code: VP-16-961b3d8e
  premisse: "Gerrit, gepensioneerd schimmelkundige, en zijn vrouw Trees laten in de schuur achter hun huis myceliumdraad tussen hun onderarmen groeien, drie dagen, omdat ze willen weten hoe het voelt om echt aan elkaar vast te zitten. Hij maakt elke ochtend een foto van zichzelf met de draad, en de buurvrouw denkt dat ze ziek zijn. Op de laatste foto ziet hij aan zijn eigen ogen dat hij iets van Trees weet wat hij niet hoort te weten. Hij vertelt het haar niet."
- code: VP-16-9bdef756
  premisse: "De avond voor de slag aan de Eufraat spreekt Tarkhan zijn ruiters toe, honderd man met Karrûk-bloed die een stadskoning voor zilver heeft gehuurd. Hij vertelt wat hij vandaag zag: de koning betaalt in gevangenen, niet in zilver, en de tempel verkoopt de gevangen vrouwen aan de winnaars, gelabeld donker thema. Hij zegt ook wat ze zelf weten: na elk gevecht kiezen ze bij het vuur met wie ze slapen en worden ze gekozen, en nooit is bij hen iemand gekocht. Wie wil nog vechten? Bij het eerste licht rijden ze de andere kant op, met de vrijgelaten vrouwen die mee willen."
- code: VP-16-a397ac0d
  premisse: "Bariqa houdt voor het vrouwenhuis een kleitablet bij met de riten in vijf graden, van zalving met olie tot de nachtwake aan de zuil, en ze heeft ze allemaal zelf gedaan. Elke keer dat er een nieuwe gouverneur komt, moet ze regels wegwrijven: eerst de vijfde graad, dan de vierde, dan de derde. Het verhaal volgt de lijst tot er alleen het wassen over is. Wat niemand weet: ze bakt elke gewiste regel opnieuw en metselt hem in de muur."
- code: VP-16-bf3dbe38
  premisse: "In het paleis van een koning aan de Eufraat strijden de vrouwen erom wie met hem naar bed mag. Dat gebeurt op feestnachten op de binnenplaats, waar elke vrouw zich laat zien zoals zij wil, voor de hele hof. Ronde na ronde klimt Iltani, tweeëntwintig en scherp, van de onderste kamer naar die bij zijn deur. In de laatste ronde ontdekt ze dat de koning al jaren niet meer komt kijken en dat de eerste vrouw de rangorde bedenkt. Voortaan schrijft Iltani mee."
- code: VP-16-c0822c98
  premisse: "Daan, verpleger in Deventer, heeft vingers die een kaars kunnen aansteken, en elke keer dat hij het doet, krijgt hij koorts die er binnen een dag uit moet. Noor kent dat uit de verhalen van haar grootmoeder, en ze ontmoette hem bij de feeënring in het stadspark. In twee stemmen vertellen ze hoe de macht omdraait: hij heeft haar nodig, niet andersom. Als ze seks hebben en zij zijn warmte opneemt, is zij een paar uur sterker dan hij."
- code: VP-2-392cfa5d
  premisse: "Orric wil macht na een leven als knecht, en die komt nu zijn zaad een prijs heeft en elke vrouw die met hem slaapt eraan vastzit. Wie te diep graaft, vindt de Sterrensteenput waar zijn vonk vandaan kwam; dan is hij geen wonder meer maar een mijnwerkerszoon uit Nerys' register."
- code: VP-2-80a7eca3
  premisse: "Oll Hartluisteraar hoort in de koortszalen van Saelith wanneer een vonkdrager gaat branden: zijn hart slaat dan dubbel, als hagel op een dak. Ze telt af, honderd slagen, veertig, tien. Die telling verkoopt ze aan de handelaarsters van de vonkmarkt, die met de man zelf een prijs afspreken voor de laatste keer seks, want een laatste ontlading is de heetste. Van haar deel koopt ze Grijswortel voor gebonden krijgsvrouwen. Op een avond telt ze verkeerd, omdat ze de honger van de klant voelt als haar eigen. De man brandt een uur te vroeg, en de vrouw naast hem brandt mee."
- code: VP-2-8c33aac9
  premisse: "Hagar de Vurige wil de kust als eigen rijk en heeft daarvoor een erfgenaam nodig, maar zijn zaad maakt vrouwen sterk en nooit zwanger. Hij laat een visser van tweeëntwintig, met een vonk te zwak om te binden, naar zijn koningin Ysolt brengen om met haar te slapen. Ysolt zegt ja, want ze wil regentes worden. Hagar kijkt toe vanachter het wandkleed, en er komt rook uit zijn mond. Na drie nachten is Ysolt zwanger en weet de visser te veel. Hagar wil hem laten verdwijnen, maar zijn vonk slaat over, en de kamer waar hij het bevel geeft, brandt met hem erin."
- code: VP-2-b1e09f00
  premisse: "Zeventien jaar na haar eerste strijdnacht steelt Hanne Strijdvrouw Grijswortel uit de legervoorraad, voor twaalf gebonden krijgsvrouwen die niet meer slapen zonder een man met vonk. In een visserskeet zweten ze negen dagen: koorts, krampen, honger. Mette, een officier van eenendertig, houdt het alleen vol met Hannes handen op haar buik. Twee stemmen vertellen de negende nacht, als het trillen stopt: Mette, die voor het eerst iets wil zonder dat de binding het afdwingt, en Hanne, wier man thuis zijn vonk in slaap zingt. Het leger hangt de diefstal aan een ander."
- code: VP-2-b559c4cf
  premisse: "Caelvonk wil een eeuwig rijk en beveelt met zijn stem wat mensen voelen, ook vlak voor de slag, als de krijgsvrouwen in rij staan. Een land dat lust tot wet maakt, kan zo'n stem niet missen, maar wie onder die wet gaat graven, vindt de zuster die hij als eerste bond."
- code: VP-2-b878466a
  premisse: "In de kelders van het hof van Saelith vult Bas Kruikvuller de zaadkruiken voor het leger: twaalf uur kracht per kruik, belooft het etiket. Hij weet dat de inhoud na een middag dood is en de vonkdragers de bestelling nooit halen. Dus vult hij aan, elke ronde anders: rijstwater, eiwit, en zijn eigen zaad, van de seks met Fenke van de keuken op de graanzakken, met de grendel op de deur. De generaals zegenen de kruiken, en de soldaten vechten precies even slecht als eerst. Alleen een kapitein die er drie tegelijk nam, komt terug zonder ogen, en Bas giet die week niets bij."
- code: VP-3-02ed4ae9
  premisse: "In het jaar zonder brood verkocht Geesje Asboerin haar man aan een vonkleger voor twee zakken rogge; dat vertelt ze aan niemand. Nu weet ze waar onder een afgebrande hoeve een graankelder ligt. Ze verkoopt de plek aan de kwartiermeester van Orlas en aan een sergeant van Varnath, elk voor een andere week, en sleept zelf vooraf de helft weg. De kwartiermeester ruikt naar brood en neemt haar mee naar zijn tent om met haar te slapen, en ze wil graag. Haar lijst telt zakken af: veertig, negentien, zeven. Thuis wachten drie monden. Dan staan beide legers in dezelfde nacht in haar kelder."
- code: VP-3-1749b6b4
  premisse: "Rhea Liedloze, spionne van een koning uit het kruisverbond, laat zich met een tatoeage achter het oor als gebonden vrouw in het kamp van Varnath brengen. Om te overtuigen moet ze echt seks met hem hebben, en zijn zaad bindt haar: een gelabeld donker thema, verteld als verlies van eigen wil, nooit als lust. We volgen haar laatste nacht. De andere vrouwen namen negen dagen Grijswortel en wachten op het teken. Rhea gooide haar wortel in de latrine, want ze weet niet meer of ze hem dood wil. Dan zingen de vrouwen het kamplied, Rhea kent de woorden niet, en Dessa ziet het."
- code: VP-3-e4ba3a7c
  premisse: "Ivi stemde tegen het Zegel en verloor, zeven tegen vijf; het briefje met de echte telling zit in haar zoom. Als straf wordt ze wasster van de Honderd. In de nacht voor het Offer gaat ze nog één keer met Ammelie, de zesendertigste, naar bed en kust de littekens van de proefsneden op haar armen. Daarna wast ze haar elke dag. Ze ziet de huid dun worden en de ogen dof, en hoort de stem die met negenennegentig andere tegelijk spreekt. Ivi's getuigenverslag houdt op bij de veertigste dag, en eeuwenlang weet alleen het Zoutklooster dat het bestaat."
- code: VP-3-fba940b8
  premisse: "Tobbe Askruier ruimt lijken op de brandvelden van Ambergaard, tandeloos en zwart van het roet, en elke ochtend loopt hij dezelfde ronde. Na de dood van Varnath vindt hij diens ring in de as. Hij verkoopt hem aan een koopman uit Saelith, een tweede aan een officier van Orlas, en een derde aan de weduwe Imke, die er met hem voor naar bed gaat omdat ze de hand wil voelen die het ding van de moordenaar van haar dorp droeg. Elke ronde liggen er minder doden, meer kopers. Bij de vijfde ring wacht de koopman hem op met een mes."
- code: VP-4-a1b3443a
  premisse: "Als de rotatieschepen van de Orde voor de Nevel-eilanden ankeren om de mannen te halen, verstopt Runa van de Mist hen in de veenhallen. Ze legt ze in het rotbed, waar de zwam over hun huid kruipt en hun adem groen kleurt, en ligt zelf tussen hen tegen de kou; door de sporen gaat elke aanraking traag. Drie dagen en nachten, in realtime, terwijl Zusters met lantaarns in het slik prikken. Twee mannen stikken in de sporen. De rest leeft langer dan wie ook op het vasteland, en de zwam gaat nooit meer helemaal van Runa's huid af."
- code: VP-4-e62961d8
  premisse: "Zuster Tine Telster liet Brecht en haar verstopte man met opzet gaan, en nu laat Saske haar naar Saelith halen voor verhoor. Voor elke zitting drinkt Tine thee bij Saske en telt wat ze kan missen. Op de derde avond neemt Saske haar mee naar bed, om te horen of ze daar anders praat, en Tine gaat, omdat ze het wil en omdat ze bang is. In de laatste zitting legt ze een blad van Brecht op tafel: Aaltje Zonderman, de buurvrouw die aangaf, verborg ooit zelf een man. Saske laat Aaltje niet hangen maar maakt haar aanklaagster, en elke aanklacht schrijft Tine."
- code: VP-4-f1a8b1b0
  premisse: "Moeder Iris moet in het jaar 90 van een noodkantoor een kerk maken, en een kerk vraagt om een liturgie. Drie ontwerpen gaan heen en weer met de Zusters: mag het woord zaad in een gebed, wordt de Deelwet gezongen of gereciteerd, hoe vaak per regel moet Ysa bedankt worden. Iris leent de mooiste zinnen uit oude drinkliederen van de Oogstnacht en één Karrûk-vloek. Elke derde nacht haalt ze een gedeelde man, die zelf om rust vroeg, buiten het rooster naar haar cel om met hem te slapen, en schrapt hem uit de telling. De liturgie wordt aangenomen; haar minnaar staat er niet in."
