- code: VP-5-649020a8
  premisse: |-
    Wiela Zoutkieuw duikt 's nachts onder de Orde-schepen van Brakhaven en zaagt de kettingen door waarmee de tiende wordt binnengesleept; twee roeiers verdrinken erbij. Haar brieven krast ze in schelpkalk, voor Aldo Veerwacht van de Tempelwacht. Hij trok haar ooit uit het water en wacht sindsdien elke derde nacht op de kademuur, met een harde pik in zijn natte broek tot ze hem berijdt. De kaperoorlog maakt hen verraders. Om haar schip vrij te kopen laat Aldo zich op een podium uitkleden voor een gemaskerde koopster: de eerste Gemaskerde Veiling. Mirre wint de haven en Aldo verliest zijn rang.
- code: VP-5-8252cbd5
  premisse: |-
    Kasboek van Veilingmeesteres Lysbet, Saelith, jaar 205. Links staan de opbrengsten van de heilige veiling en de wierook, rechts een kolom die alleen zij leest. Daar verkoopt ze dezelfde uren met de Uitverkorene Ilmar-as steeds aan twee klanten. Twee rijke weduwen betalen allebei de volle prijs en gaan samen met hem naar bed: de ene heeft seks met hem, de andere kijkt toe, en ieder denkt dat zij korting heeft bedongen. Bij elke post gloeien Ilmars aderen feller, en Lysbet boekt dat als zegen. Registratrix Corvina telt mee, en het Varenne-krediet aan de Orde groeit met iedere dubbele regel.
- code: VP-5-a4417a37
  premisse: |-
    Nog negen dagen tot Merk. Hadra Karavaanleidster heeft voer voor negen dagen, achttien Kharvos-mannen aan één keten en een Varenne-koopvrouw die per levende man betaalt. Op de Amberpas sneeuwt het dicht. Iskarre, een Ves-Lethi-wisselaarster van vierendertig, neemt 's nachts het gezicht aan dat Hadra wil en likt haar onder de huiden tot ze klaarkomt. Bij nog vier dagen sterft de eerste man; ze laat hem liggen. Bij nog drie ziet Hadra dat de sterkste gevangene de tempels op zijn onderarm kerft, lijn na lijn. Ze brengt geen vee naar Merk, maar een spion.
- code: VP-5-d5794c5c
  premisse: |-
    Jij, Ysa, hoort het elke nacht: Oswin Kuisprediker preekt 's ochtends op de vismarkt van een Zoutkustdorp dat tempelseks u beledigt, en 's avonds gaat hij biechten bij de weduwe Marrit. Ze laat hem vertellen welke zonde hij wil, trekt haar rokken op en neukt hem op de tafel tussen de kabeljauw tot hij klaarkomt. Het dorp gehoorzaamt hem. Niemand wordt nog zwanger, en de netten rotten omdat niemand trouwt. Dan stuurt de Orde een Moeder om de zwangere vrouwen te tellen. Ze vindt er één: Marrit. De Moeder noemt het een wonder van de tempel en laat Oswin verbannen.
- code: VP-5-f3131ca9
  premisse: |-
    Priesteres Amaris leidt de Ontvangstzaal en houdt een lijst bij van haar ontvangsters: naam, hoe vaak ze seks hadden, kleur van het haar. Sinds 240 wordt die lijst korter. Vrouwen van dertig liggen wit en uitgedroogd in hun cel, en de Orde noemt hen gezegend grijs. Amaris ziet dat het licht feller brandt bij elke vrouw die verdwijnt. Om het te bewijzen heeft ze zelf seks onder het licht, met de Uitverkorene van wie ze ooit hield. In één nacht wordt haar haar wit. De Moeders zetten haar naam bovenaan, als heilige.
- code: VP-6-0b53e68a
  premisse: |-
    Elf dagen voor de Moeders de fokstal van Hal-Neth komen keuren, heeft Zarah de Pestmoeder honderd mannen beloofd. Ze zet neven bij neven en broers in één hok, omdat verwante lijnen sterker lijken te gloeien. Zelf neemt ze 's nachts de sterkste mee naar haar kamer om met hem naar bed te gaan, en hij wil dat even graag. Bij nog acht dagen ruikt de stal naar rotte appels. Bij nog zes schuift ze de eerste dode onder het hooi, zodat de telling klopt. Als de Moeders aankloppen, telt Zarah niet meer mee: de builen zitten in haar eigen liezen.
- code: VP-6-1b080fd5
  premisse: |-
    In Ves-Anath, jaar 603, leid ik met twintig wachters de laatste bewoners weg van de zegelsteen; de straten ruiken naar warm vlees en natte kalk, en wie terugloopt, krijgt de kolf. Bij de Vleestempel wacht Corrin, wiens rug in de muur is overgegaan. Twee nachten heb ik op hem gereden, mijn mond op zijn vergroeide schouder, omdat hij erom vroeg en ik hem wilde. Ik mag drie karren vullen; hij past op geen enkele. Op mijn armen komen vlekken. Tegenover de Orde zwijg ik, en de vlekken groeien tot ik eraan doodga.
- code: VP-6-4716cfda
  premisse: |-
    Eerste ronde op de Zaadbeurs: Mattheus Beursman koopt termijnen op het zaad van een stier die niet bestaat. Tweede ronde: hij levert de flacons zelf, onder een vals stalmerk, en zijn minnares Hester trekt hem 's nachts af boven de flacons, tot zijn knieën trillen en zij niet meer kan van het lachen. Derde ronde: de prijs verdubbelt, de Orde verklaart het merk heilig, en de vraag wordt groter dan één vrijgekochte man kan leveren. Vierde ronde: Huis Varenne biedt op de stier zelf. Mattheus wint die veiling niet, want hij wordt zelf geveild.
- code: VP-6-6812d834
  premisse: |-
    Gelabeld donker thema, verteld in inspectieverslagen aan de Orde. Moeder Ilvane laat in de stallen van het Hoogvrouwe-gebergte mannen in ketens buiten waken, een winternacht lang; wie dat volhoudt, mag daarna één keer binnen seks hebben. Heilige zorg, schrijft ze; de bijlagen tellen bevroren tenen. Wie bezwijkt, verkoopt ze als boeteling aan Kaldra. Ze kijkt toe vanachter een luik, en dat staat in geen enkel verslag. Stalman Wouter vervalst één verslag zodat het in Saelith wordt gelezen. Het laatste document is een lijkschouwing: Ilvane, gewurgd met haar eigen ketting.
- code: VP-6-cbf00f9d
  premisse: |-
    Twee stemmen uit de kleine pest van 470. Kapitein Vessa: mijn bemanningen rotten in de ruimen voor Brakhaven, en huurlingen van Varenne enteren elk schip dat de blokkade breekt. Lena Pestwacht: ik weet dat de koorts uit de Varenne-stallen kwam, ik heb het opgeschreven. Vessa ruilt dat rapport en dertig schepen voor een open haven. De koop maakt ze rond op haar eigen achterdek, met de factor van Varenne die haar al twintig jaar wil: eerst likt hij haar op zijn knieën, dan mag hij haar neuken. Lena neemt het zwijggeld aan. De haven gaat open, en aan de kust wordt Vessa's naam een vloek.
- code: VP-6-e9545445
  premisse: |-
    De kluiswachter die zich de vervalsing van 205 herinnert, wil de echte annalen redden voordat het Tribunaal ze in een la bevriest. Daarvoor moet hij ze toevertrouwen aan de snelle jonge Aelthir die alles ruilen, en wat er van de waarheid overblijft, hangt dan af van wie met hen naar bed wil.
- code: VP-7-0a79f9dc
  premisse: |-
    Een vuurkamplied van de Karrûk. Asha Driekerf slaat haar broer met de hakbijl tot zijn arm niet meer heft, en draagt als eerste vrouw het kampioensband. Nu mag zij kiezen met wie ze na het gevecht de ontlading heeft. De clan wil Brann aan Kharvos verkopen, zijn zaad tegen wapens. Asha kiest Brann en hij zegt ja. Bij het vuur, voor de hele clan, trekt ze hem op de grond en berijdt ze hem, nog bezweet van het gevecht, tot ze allebei klaarkomen. Het refrein telt de prijs: een arm, de wapens, en de ruiters die in het voorjaar komen innen.
- code: VP-7-32092118
  premisse: |-
    In de vestingzaal van Kaldrun spreekt Generaal Sorre haar krijgsvrouwen toe, de nacht voordat het jaar 722 de Amberpas kost. Ze zegent de wapens, laat het maankruid rondgaan en stuurt de vrouwen één voor één achter het gordijn om seks te hebben met de twee gaven-mannen. Niemand weet wat zij weet: ze wil hen morgen niet sterk, maar leeg. Na de Strijdontvangst komt de Leegte, en dan houdt niemand de poort. Kharvos heeft haar haar zoon beloofd. Bij dageraad stromen de ruiters door de pas, haar zoon rijdt niet mee, en Grom de Jongere heeft alles gezien.
- code: VP-7-6e27cce7
  premisse: |-
    Brenda Wortelhandel houdt een lijst bij van gebonden vrouwen aan de Zoutkust die ze Grijswortel bracht, met achter elke naam een streepje: los. Dezelfde lijst gaat naar de Stille Hand, die de vrijgekomen vrouwen ophaalt, en zo krimpt hij. Bij Ossian-ir gaat ze zelf naar binnen. Ze kauwt de wortel tot haar tandvlees groen ziet en laat zich in zijn zouthof vol gloeiende aderen van achteren neuken tot hij in haar klaarkomt; zijn zaad werkt niet bij haar. Een snipper wortel laat ze achter bij zijn derde vrouw. Twee nachten later is Ossian dood. Op de lijst staat die vrouw al doorgestreept.
- code: VP-7-a4570361
  premisse: |-
    Bloednacht, 788, vier uur voor dageraad. Wietske van Lisk zit in de kerker onder de raadszaal, en door de voegen boven haar druppelt het bloed van de priesteressen. Twee jaar geleden ging ze uit vrije wil met Morvane-ir naar bed, en die eerste keer was goed. Wat daarna kwam, de Bloedverbinding, is een gelabeld donker thema: sindsdien trekt zijn bloed aan haar als een vishaak. Nu snijdt ze met een scherf het litteken uit haar palm en kruipt met drie zusters door de bloedgoot, terwijl de verbinding haar steeds terugtrekt naar hem.
- code: VP-801-1226fe60
  premisse: |-
    Dagboek van Hoedster Imra, Hoofdtempel van Saelith, in de weken na Teo's Wijding. Ik heb Zuster Ennia door de onderwaterpoort binnengelaten, een ketterse die de Orde wil breken, en nu slaapt ze in mijn cel. Ze likt me tot ik in mijn kussen bijt, wat de regel verbiedt. 's Ochtends preek ik over de heilige Ontvangst; 's nachts lezen we het register dat ik stal, met kaarsvet op haar buik. De Stille Hand doorzoekt elke cel behalve de mijne, want ik sta boven verdenking, en ik lieg elke dag beter.
- code: VP-801-2deedf98
  premisse: |-
    Wij waren zeven, Kaldra-huurlingen zonder huis, en Schuldmeesteres Kreel betaalde vooruit voor één ding uit Lisk: drie flacons bloed van Morvane-ir zelf. De nacht ervoor zopen we in een bordeel aan de Brakhavense kade en neukten we met wie ons wilde; Tjalda nam er twee tegelijk mee naar boven. In de Bloedkerk knielden de gebonden priesteressen in hun eigen bloed en keken niet op toen we langsliepen. Meekomen konden ze niet meer willen. Tjalda vulde de flacons uit de offerschaal, maar buiten zijn lichaam stolt zijn bloed tot zwart grind. Vier van ons kwamen terug, onbetaald.
- code: VP-801-7ecdb0e8
  premisse: |-
    Dit lichaam is van Mavra Vleesmoeder, en ik ben gegroeid: twee extra borsten onder de eerste, een huidplooi over mijn heup die de rug van een ander heeft opgenomen. In de Vleestempel van Hal-Neth leg ik me naast Ysbe, vierentwintig, die zelf kwam en drie keer ja zei ten overstaan van de gemeente. Sinds het Zegel lekt, groeit vlees sneller aaneen; bij dageraad zijn haar zij en de mijne één. Wie de rite niet overleeft, verkoopt Mavra aan de randcompagnie van Varenne. Ysbe overleeft, en haar hart zit nu naast het mijne.
- code: VP-801-b41dabc3
  premisse: |-
    Schuldmeesteres Kreel van Huis Varenne boekt alles in één grootboek met zilveren sloten: schulden in zilver, schulden in seks, en mannen die bij wanbetaling als Lijngraver worden afgeleverd, wat ze noteert als omgezet. Kapitein Hadda Teerling staat met drie schepen in het rood. De eerste termijn betaalt ze in Kreels kantoor, op het grootboek zelf: ze zit op Kreels gezicht tot ze klaarkomt, en Kreel likt daarna haar zilveren tanden schoon. Bij het tellen merkt Kreel dat er een blad ontbreekt: dat met de vervalste Lijngravercontracten. Hadda verkoopt het aan Mirre. Nu staat Kreel in het rood.
- code: VP-801-e35a3d80
  premisse: |-
    Proces-verbaal 4112, Brakhaven, Oogstmaan 801. Inspectrice Gerla meet met een nieuwe meetlat de bedden in de huizen met vrije mannen aan de Pekelrij, want de Orde schrijft een maximale lengte voor, van het bed en van hoe lang er geneukt mag worden. In verbaal 4113 biedt de madam haar een man aan in plaats van een boete; Gerla weigert schriftelijk, en daarna nog eens, minder stellig. Verbaal 4114 beschrijft een achterkamer met een Orde-zegel op de deur en een Moeder uit Saelith in het bad. Verbaal 4115 gaat naar de Hoofdtempel. Gerla houdt haar post, en de man houdt ze ook.
- code: VP-9-05430398
  premisse: |-
    Op het oogstfeest aan de Zoutkust trekken Lijsbet en haar vriendin Wobbe lootjes om Jasper, die nog een vonk heeft die een kaars aansteekt. Om beurten nemen ze zijn pik in hun mond, ronde na ronde, en het lot zegt wie begint. Lijsbet zorgt stiekem dat zij steeds aan de beurt is als hij klaarkomt, want dat geeft de meeste kracht. Wobbe ziet het pas bij de derde ronde, laat het gaan en neemt geen Maankruid. In het voorjaar heeft Lijsbet de kracht, en Wobbe heeft Jasper.
- code: VP-9-0a05e0bd
  premisse: |-
    Corvin Aldeweer komt uit de fokstal van Varenne en is een van de laatste mannen met vonk, maar die vonk wordt elke maand dunner. Hij laat zich door zijn vrouw in boeien van zegelsteen sluiten, de sleutel bij de buurvrouw, omdat de vonk even terugslaat als de boeien afgaan. In zijn dagboek houdt hij bij hoe lang dat duurt: een uur, een kwartier, een ademhaling. Op een ochtend komt er niets terug, en hij weet niet of dat door de steen komt of door de tijd.
- code: VP-9-187d7dc1
  premisse: |-
    Sjoerd is twintig, zoon van een zoutzieder, en hij heeft gewed dat hij een hele nacht in de paaipoel van de Oevrin durft te blijven. We volgen die nacht minuut voor minuut: het lauwe slik, de zang van de Oevrin die hij in zijn ribben voelt, de afscheiding die zich mengt tot niemand weet wat van wie is. Hij komt klaar in het slik, met zijn pik in een hand die hij niet kan zien. Hij raakt zijn schoenen kwijt, verliest de weddenschap en is niet verlegen meer. Bij laag tij kruipt hij eruit, en de Oevrin vragen hem met de volgende springvloed terug.
- code: VP-9-1d462872
  premisse: |-
    Sahra verkoopt in Brakhaven vonkcellen, prikkeldraadjes die tintelen op de huid, met een dimmer voor wie ze draagt. De lading komt van Corvin Aldeweer, die steeds minder te geven heeft, dus mengt ze er gemalen glas door en liegt over de rest. Eén nacht, uur na uur verteld: een klant laat haar de draadjes om zijn pik leggen, ze berijdt hem en draait de dimmer open, en bij de eerste schok roept hij het stopwoord van de Kharvos-grens. Hij is een spion, en de schokken die hij terugstuurt, zijn een bericht voor haar.
- code: VP-9-23f43f60
  premisse: |-
    Oriane, een Sael-mor-vrouw met een spleet in haar hals, deelt op Ysa-dag in Saelith de armbanden uit: wie er een draagt, is volwassen en doet mee. Bij zonsopgang ligt er een man dood tussen de kussens, met twee armbanden om zijn pols. De stadsrechtbank wil dat Oriane zweert dat ze hem er maar één gaf. Voor de rechters, met Moeder Aurelie als getuige, legt ze uit hoe de armbanden geteld worden, en zo komt uit wie de beurt van een ander had genomen.
- code: VP-9-25bf2833
  premisse: |-
    Jij bent Dorran, eenentwintig, melkman in de stallen van Varenne, en elke ochtend melkt meesteres Ilona je met dezelfde zorgvuldige hand. Je hebt nooit iets gewild, omdat niemand het vroeg. Op een ochtend kijk je haar aan en zeg je dat ze langzamer moet. Ze doet het. De volgende dag zeg je wanneer ze moet stoppen, en de dag erna wanneer niet. Een week later staat zij met haar rug tegen de stalmuur, haar rok omhoog en haar kut nat, en vraagt ze jou of je haar wilt neuken.
- code: VP-9-31b42fe0
  premisse: |-
    Ik ben het kinkregister van de Orde, tweehonderd soorten genot op tien domeinen, van oorlog tot spionage, en Lotje Inkt kocht mij voor een prik toen de Orde vertrok. Ze verkoopt mijn bladen los aan de Huizen van Spel, en aan iedereen die wil weten wat zijn buurvrouw in 790 deed. Gerolt van de Mannenraad koopt het blad over de machtsruil. Met elk verkocht blad word ik dunner. Ze wordt er niet rijk van, en aan het eind kan niemand meer zien hoe de soorten genot met elkaar samenhingen.
- code: VP-9-458079fa
  premisse: |-
    Veertig dagen na de geboorte van haar dochter loopt Tjitske, als eerste Grauwen-vrouw van het dal, het badhuis van het mensendorp binnen voor de melkzegen. Ze zit in het warme water, krijgt olie op haar buik, en haar gouden sjerp wordt vervangen door een rode. Haar grootmoeder wacht buiten op de stoep, want bij de Grauwen bestaat dit niet. Die avond trekt Tjitske haar man op zich en neukt ze hem voor het eerst sinds de geboorte.
- code: VP-9-53deccbc
  premisse: |-
    Orlenhal stuurt Joren van de Pekelrij met zijn oude halsband om naar Lisk, omdat de Bloedkerk een vrijgekomen stalman gelooft. Zijn brieven, ingenaaid in de zoom van een priesteressenmantel, melden wat niemand mag weten: de bloedverbinding houdt niet meer. Elke priesteres zegt elke nacht zelf ja, uit angst of uit gewoonte. Zuster Ardeth vertelt het hem terwijl hij haar neukt, met korsten van rituele sneden op haar armen en haar polsen aan het bed vast met zijn halsband, omdat zij erom vraagt. De laatste brief komt aan. De raad van Orlenhal leest hem, verdient aan de oorlog en verbrandt hem.
- code: VP-9-5cd07985
  premisse: |-
    In het IJsgraf staan Brenna en haar nicht naakt op het ijs terwijl een Moeder van Huis Kaldra de minuten aftelt; wie het langst blijft, mag met Tarvel naar bed, de laatste gaven-man van het huis. Brenna weet wat haar nicht niet weet: Tarvels vonk is op, er valt geen kracht meer te winnen. Ze blijft staan, om hem, tot haar tenen zwart kleuren. De nicht geeft op en kijkt toe. Brenna verliest twee tenen en wint een man zonder gave.
- code: VP-9-5f90f76c
  premisse: |-
    Een Ishvar-man die de Orde altijd waardeloos noemde, omdat zijn zaad geen kracht heeft, wordt bij de eerste Vrije Ontvangst van Saelith tot hoedster gekozen: hij is de enige die niet met vonk kan pronken. In één zaal en één nacht moet hij een feest leiden waarvan niemand de regels nog weet, en hij merkt dat de vrouwen juist met hem willen neuken omdat hij gewoon is.
- code: VP-9-8dbb1f3b
  premisse: |-
    Het kasboek van Askja Roetkam, huurlingenkapitein met Karrûk-bloed, rekent in zilver en in seks. Orlenhal betaalt per dag dat haar veertig zwaarden op de muur staan; de Bloedkerk van Lisk betaalt het dubbele voor één open poort. Ze int bij allebei. Ze slaapt met de raadsvrouw om het wachtrooster te lezen, met een priesteres om het zilver te wegen. In het kerkkamp ziet ze vrouwen met korsten van de bloedverbinding die vergeten zijn hoe weigeren gaat, gelabeld donker thema. Haar laatste post is een rekening die ze de Bloedkerk met staal presenteert, in de poort die open moest.
- code: VP-9-b0775c41
  premisse: |-
    Gerolt schrijft pamfletten voor de Mannenraad van Ambergaard, en zijn sterkste beeld is seks waarbij de man de baas is. Hij betaalt een paar dat de machtsruil op het plein speelt, als bewijs dat mannen kunnen leiden. Uit zijn brieven, de pamfletten en het verslag van de schout blijkt wat de Raad nooit hoort: de vrouw kiest elke keer zelf, de man vraagt bij elk bevel of het goed is, en Gerolt schrijft alles om. Alleen de schout weet het, en die zwijgt.
- code: VP-9-b33ae572
  premisse: |-
    In het Zonnepaleis van Qesh is Naïma de enige haremvrouw die nog om de vuurgloed vraagt, ook nu niemand haar een seizoen dienst meer kan opleggen. Sahir, een kleinzoon van Khaled-Ir, heeft nog vuur in zijn handen, maar het gehoorzaamt hem slecht: als hij haar vingert, zijn ze soms koel en dan ineens heet tot aan de grens van pijn, en zo komt ze klaar. Ze vertellen het om beurten. Op een nacht zegt ze het stopwoord zon, en hij stopt meteen, maar het vuur in zijn handen gaat door.
- code: VP-9-c68f53b9
  premisse: |-
    Een lied uit de vrije stad Orlenhal: als de Bloedkerk de muren bestormt, houdt de stormman Haskel de poort met de laatste bliksem uit de Barsten. Daarna moet hij ontladen, anders verbrandt hij van binnen. Mareike, heelster van de stad, kiest te blijven en krijgt van hem het woord stil. Ze neukt hem tot de dageraad, en elke keer dat hij in haar klaarkomt, trekt de storm door haar heen. Hij geneest, maar een deel van de bliksem blijft in haar handen achter, en vanaf die ochtend is hij een gewone man.
- code: VP-9-e914fd27
  premisse: |-
    Wij, Bastiaan en Rinske, hebben elkaar tien jaar alleen in schuren geneukt, in hooi en tussen netten, juist omdat het niet mocht. Nu mag alles, de tempel vraagt niets meer, en in ons eigen bed gebeurt er niets. We proberen de hooizolder van de schout, de boot van de veerman, een tent op de markt. Niemand jaagt ons weg. Pas als Rinske hardop vraagt of hij haar wil likken, en hij lang genoeg wacht met zijn antwoord, voelt het weer als stelen.
- code: VP-9-f571fb89
  premisse: |-
    Aldric is zeventig en zijn geestgave is al jaren weg, maar Ilvaren, de Aelthir met wie hij elke winter naar bed gaat, weet dat niet. In brieven aan zijn broer beschrijft hij hoe hij doet alsof hij haar genot nog voelt: als hij haar likt, volgt hij uit herinnering haar adem, haar stiltes, het moment dat ze koel wordt. Zij denkt dat hij haar voelt, en ze vertrouwt hem dingen toe die ze alleen aan iemand in haar hoofd zou zeggen. De laatste brief schrijft hij op de avond dat ze vraagt wat zij nu denkt.
