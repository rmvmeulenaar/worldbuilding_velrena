# M1/M2: kernset motieven, geclusterd over culturen heen.
# Codes: Thompson Motif-Index en ATU, alleen ingevuld waar de architect ze zeker weet; anders leeg (ter controle tegen de index). We nemen motieven, nooit teksten.
# en: Engelse sleutelwoorden om Wikidata-entiteiten (naam + beschrijving) als lid te herkennen.
# nl: Nederlandse sleutelwoorden om kandidaat-oorsprongen in de canon te scoren (M3). laag: richting, de score beslist.
# voorbeelden: naam (cultuur). Harde lijnen gelden voor elke oorsprong.

- id: zondeval
  naam: De zondeval en het verloren paradijs
  kern: de eerste mensen leven zonder dood of zwoegen, overtreden één verbod om kennis of kracht en worden verdreven naar een leven van arbeid, pijn bij het baren en sterfelijkheid
  thompson: A1331
  herkenning: de verboden vrucht, de verleider, de verdrijving uit de tuin, de wachter met het vlammende zwaard
  laag: 0
  en: [eden, paradise, garden of, forbidden fruit, fall of man, tree of knowledge, golden age, lost paradise]
  nl: [verbod, stemming, deur, slaper, slaapkamer, verdreven, landing, schip, Hesta, Rekenaar, Reckoner, kennis, sleutel, zwoegen, sterfelijk, baren, geboorte, Wortel]
  voorbeelden: [Adam en Eva (Bijbels), Adapa (Mesopotamisch), de gouden eeuw van Hesiodus (Grieks), Dilmun (Sumerisch), Yima's Vara (Perzisch), de Droomtijd die eindigt (Australisch), de hemelvrouw die valt (Haudenosaunee)]

