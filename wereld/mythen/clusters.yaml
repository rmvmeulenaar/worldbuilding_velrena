  nl: [Hesta, deur, open, kist, kluis, blauwe licht, test, cellen aan, hoop]
  voorbeelden: [Pandora (Grieks), Eva (Bijbels), Izanami die achteromkijkt (Japans), Psyche en het doosje (Grieks)]

